[package]
name = "brume-setup"
version = "0.1.0"
description = "Installer for Brume"
authors = ["london-christensen"]
edition = "2021"
rust-version = "1.77.2"

# The output binary is the thing a user double-clicks, so it is named for them
# rather than for cargo.
[[bin]]
name = "Brume-Setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Same minimal footprint as the browser itself. tauri-plugin-dialog is here for
# exactly one thing - the native "choose a folder" picker, which is not worth
# reimplementing over IFileDialog by hand.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
