[package]
name = "brume-setup"
version = "0.7.0"
description = "Installer for Brume"
authors = ["london-christensen"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

# The output binary is the thing a user double-clicks, so it is named for them
# rather than for cargo.
[[bin]]
name = "Brume-Setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Same minimal footprint as the browser itself. tauri-plugin-dialog is here for
# exactly one thing - the native "choose a folder" picker, which is not worth
# reimplementing over IFileDialog by hand.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
winreg = "0.55"

# One function: GetCommandLineW.
#
# When the updater runs this exe it appends flags that have to reach NSIS
# byte-for-byte. Rust's args_os() splits the command line with CommandLineToArgvW
# rules and drops the quoting, so rebuilding a command line from it can change
# what NSIS sees. Reading the raw line and forwarding the tail verbatim avoids
# the round trip entirely. Already in the dependency tree via tauri.
windows-sys = { version = "0.60", features = ["Win32_System_Environment"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
