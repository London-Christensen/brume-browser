[package]
name = "brume"
version = "0.2.0"
description = "A lightweight Windows web browser built with Tauri and the native WebView2 runtime"
authors = ["london-christensen"]
edition = "2021"
# Tauri 2 requires at least this compiler.
rust-version = "1.77.2"

# The binary is named `brume`, which is what ends up installed as brume.exe.
[[bin]]
name = "brume"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately minimal. Every dependency added here shows up in the shipped
# binary, and staying small is the entire premise of this project.
# The "unstable" feature is what unlocks multiple webviews inside one window.
#
# It is not optional for a browser: the chrome and the page have to be separate
# webviews. The obvious alternative - rendering pages in an <iframe> inside the
# chrome - does not work, because X-Frame-Options and frame-ancestors let any
# site refuse to be framed, and most large ones do. Google, the default new-tab
# destination, is among them.
#
# The cost is that Tauri may change these APIs in a minor release. They are
# confined to browser.rs so that a breaking change has one place to be fixed.
tauri = { version = "2", features = ["unstable"] }

# Auto-update. The three plugins are one feature between them: updater fetches
# and verifies, dialog asks the user first, process performs the relaunch.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

# Keyboard shortcuts. Registered only while Brume has focus - see shortcuts.rs
# for why a menu accelerator table cannot do this job on Windows.
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reads the auto-update preference the installer wrote to HKCU.
winreg = "0.55"

[profile.release]
# Tuned for a small binary rather than raw throughput. A browser shell spends
# almost all of its time inside WebView2, not inside our Rust code, so trading
# some compile time and a little speed for size is the right call here.
codegen-units = 1   # Whole-program view for the optimizer; slower builds, smaller output.
lto = true          # Link-time optimization across crate boundaries.
opt-level = "s"     # Optimize for size over speed.
panic = "abort"     # Drop unwinding tables; we do not catch panics.
strip = true        # Strip debug symbols from the release binary.
