            openMenu(
              { clientX: rect.left, clientY: rect.bottom + 2 },
              buildFolderMenu(bookmark)
            );
          });
          node.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            openBookmarkMenu(event, bookmark);
          });
          return node;
        }

        // Both lines: the title is truncated to fit the bar, and the URL is the
        // part that says where this actually goes.
        node.title = `${bookmark.title || bookmark.url}\n${bookmark.url}`;
        node.appendChild(faviconNode(bookmark.url, false));

        const title = document.createElement("span");
        title.className = "bm-title";
        // A page bookmarked before its title arrived has none; the URL is at
        // least something to read.
        title.textContent = bookmark.title || bookmark.url;
        node.appendChild(title);

        node.addEventListener("click", () => openBookmark(bookmark, false));
        // Middle click opens in a new tab, as it does on any link.
        node.addEventListener("auxclick", (event) => {
          if (event.button !== 1) return;
          event.preventDefault();
          openBookmark(bookmark, true);
        });
        node.addEventListener("mousedown", (event) => {
          // Or the middle button starts an autoscroll over the chrome instead.
          if (event.button === 1) event.preventDefault();
        });
        node.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          openBookmarkMenu(event, bookmark);
        });
        return node;
      }

      function openBookmarkOverflow(event) {
        // Without this the click carries on to the document listener that
        // dismisses menus, and this one closes in the tick it opened.
        event.stopPropagation();
        const rect = el("bm-more").getBoundingClientRect();
        openMenu(
          { clientX: rect.left, clientY: rect.bottom + 2 },
          (add, separator, submenu) => {
            for (const bookmark of bookmarkOverflow) {
              if (bookmark.is_folder) {
                submenu(bookmark.title, buildFolderMenu(bookmark));
              } else {
                add(bookmark.title || bookmark.url, true, () =>
                  openBookmark(bookmark, false)
                );
              }
            }
          }
        );
      }

      async function renderBookmarksBar() {
        const bar = el("bookmarks");
        if (bar.hidden) return; // nothing to measure while it is off

        bookmarkItems = (await call("bookmarks")) || [];
        bar.textContent = "";
        bookmarkOverflow = [];
        // Only the root level goes on the bar. Everything filed into a folder
        // is reachable through that folder's menu, which is the whole point of
        // having folders; putting the flat list up here would undo it.
        barItems = childrenOf(null);

        if (!barItems.length) {
          const hint = document.createElement("span");
          hint.className = "bm-empty";
          hint.textContent = "Bookmarks you save with Ctrl+D appear here.";
          bar.appendChild(hint);
          return;
        }

        // Insertion order, oldest first. The store appends, and a bar that
        // reordered itself every time a page was saved would be hard to use -
        // the whole value of a bookmark bar is that a thing stays where you last
        // saw it. The panel sorts newest first, which is right for a list you
        // read rather than one you aim at.
        barItems.forEach((bookmark, index) =>
          bar.appendChild(bookmarkNode(bookmark, index))
        );

        const more = document.createElement("button");
        more.className = "bm bm-more";
        more.id = "bm-more";
        more.title = "More bookmarks";
        more.setAttribute("aria-label", "More bookmarks");
        more.innerHTML = '<span class="ico ico-chevron-right"></span>';
        more.addEventListener("click", openBookmarkOverflow);
        bar.appendChild(more);

        layoutBookmarksBar();
      }

      /* Moves whatever does not fit into the overflow menu.
       *
       * Measured rather than counted: how many bookmarks fit depends on the
       * font, the titles and the window width, so there is no number that works.
       * Runs after every render and on every resize.
       */
      function layoutBookmarksBar() {
        const bar = el("bookmarks");
        const more = el("bm-more");
        if (bar.hidden || !more) return;

        // Everything shown first. A hidden element measures zero, so anything
        // already moved out would stay out as the window grew.
        const items = [...bar.querySelectorAll(".bm:not(.bm-more)")];
        for (const node of items) node.hidden = false;
        more.hidden = false;
        bookmarkOverflow = [];

        const style = getComputedStyle(bar);
        const gap = parseFloat(style.columnGap) || 0;
        const inner =
          bar.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight);

        const widths = items.map((node) => node.offsetWidth);
        const total = widths.reduce((sum, w) => sum + w + gap, 0) - gap;

        if (total <= inner) {
          // It all fits, so there is nothing behind the button and it goes away.
          more.hidden = true;
          return;
        }

        // The button is staying, so it comes out of the space available.
        const budget = inner - more.offsetWidth - gap;
        let used = 0;
        let overflowing = false;

        items.forEach((node, i) => {
          used += widths[i] + (i ? gap : 0);
          // Once one item has been pushed out, so is everything after it. The
          // bar keeps its order rather than slotting in a narrower later
          // bookmark, which would shuffle on every resize.
          if (overflowing || used > budget) {
            overflowing = true;
            node.hidden = true;
            bookmarkOverflow.push(barItems[Number(node.dataset.index)]);
          }
        });
      }

      // --- panel ----------------------------------------------------------
      let panelView = "history";

      /* Which day a visit belongs to, for the headings in history.
       *
       * Compared as local calendar days rather than by elapsed seconds: a visit
       * 20 hours ago can easily be yesterday, and "23h ago" under a heading
       * saying Today is exactly the confusion the headings exist to remove. */
      function dayLabel(unixSeconds) {
        const then = new Date(unixSeconds * 1000);
        const today = new Date();
        const midnight = (d) =>
          new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const days = Math.round((midnight(today) - midnight(then)) / 86400000);
        if (days <= 0) return "Today";
        if (days === 1) return "Yesterday";
        if (days < 7) {
          return then.toLocaleDateString(undefined, { weekday: "long" });
        }
        return then.toLocaleDateString(undefined, {
          day: "numeric",
          month: "long",
          year:
            then.getFullYear() === today.getFullYear() ? undefined : "numeric",
        });
      }

      /** Compact relative time: browsing history is read as "when", not "at". */
      function whenLabel(unixSeconds) {
        const secs = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
        if (secs < 60) return "just now";
        if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
        if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
        const days = Math.floor(secs / 86400);
        if (days < 30) return `${days}d ago`;
        return new Date(unixSeconds * 1000).toLocaleDateString();
      }

      function entryNode({
        title,
        url,
        when,
        onOpen,
        onRemove,
        onRename,
        // Manager extras. A folder has no favicon and no URL to show, and the
        // tree needs to say how deep a row sits.
        depth = 0,
        isFolder = false,
        subtitle,
        onMenu,
      }) {
        const row = document.createElement("div");
        row.className = isFolder ? "entry entry-folder" : "entry";
        if (depth) row.style.paddingLeft = `${10 + depth * 16}px`;
        row.addEventListener("click", onOpen);
        if (onMenu) {
          row.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            onMenu(event);
          });
        }

        if (isFolder) {
          const mark = document.createElement("span");
          mark.className = "ico ico-chevron-down entry-folder-mark";
          row.appendChild(mark);
        } else {
          // Lazy: the panel renders up to 300 of these at once.
          row.appendChild(faviconNode(url, true));
        }

        const text = document.createElement("div");
        text.className = "entry-text";
        const t = document.createElement("div");
        t.className = "entry-title";
        t.textContent = title || url;
        const u = document.createElement("div");
        u.className = "entry-url";
        u.textContent = subtitle !== undefined ? subtitle : url;
        text.append(t, u);
        row.appendChild(text);

        if (when) {
          const w = document.createElement("div");
          w.className = "entry-when";
          w.textContent = when;
          row.appendChild(w);
        }

        /* Renaming happens in place rather than in a dialog.
         *
         * The title becomes an input on click, commits on Enter or blur, and
         * reverts on Escape. A dialog for one short string is more ceremony
         * than the edit deserves, and in-place keeps the row you are editing
         * next to the URL that tells you which one it is. */
        if (onRename) {
          const edit = document.createElement("button");
          edit.className = "entry-remove";
          edit.title = "Rename";
          edit.setAttribute("aria-label", "Rename");
          edit.innerHTML = '<span class="ico ico-edit" style="width:11px;height:11px"></span>';
          edit.addEventListener("click", (event) => {
            event.stopPropagation();
            const field = document.createElement("input");
            field.type = "text";
            field.className = "entry-rename";
            field.value = title || "";
            field.spellcheck = false;

            let done = false;
            const finish = (commit) => {
              if (done) return; // blur fires after Enter too
              done = true;
              const next = field.value.trim();
              field.replaceWith(t);
              if (commit && next && next !== title) onRename(next);
            };
            field.addEventListener("keydown", (e) => {
              e.stopPropagation();
              if (e.key === "Enter") { e.preventDefault(); finish(true); }
              else if (e.key === "Escape") { e.preventDefault(); finish(false); }
            });
            field.addEventListener("blur", () => finish(true));
            // Or clicking into the field opens the bookmark under it.
            field.addEventListener("click", (e) => e.stopPropagation());

            t.replaceWith(field);
            field.focus();
            field.select();
          });
          row.appendChild(edit);
        }

        if (onRemove) {
          const rm = document.createElement("button");
          rm.className = "entry-remove";
          rm.title = "Remove";
          rm.setAttribute("aria-label", "Remove");
          rm.innerHTML =
            '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg>';
          rm.addEventListener("click", (e) => {
            e.stopPropagation(); // otherwise the row's open handler also fires
            onRemove();
          });
          row.appendChild(rm);
        }

        return row;
      }

      /* One row in the downloads list.
       *
       * Deliberately not entryNode: a download has a filename rather than a
       * page title, its secondary line is a filesystem path rather than a URL,
       * and clicking it should reveal the file rather than navigate. Sharing
       * the function would have meant a parameter for each of those.
       *
       * Everything page-controlled goes through textContent. A filename comes
       * from a Content-Disposition header, which is to say from the server. */
      /* Bytes as something readable.
       *
       * Binary units, because that is what Explorer shows for the same file and
       * disagreeing with the file manager about the size of a file is a bad look.
       * One decimal below 100 and none above: "9.4 MB" reads better than "9 MB",
       * and "412.7 MB" is more precision than anyone asked for. */
      function formatBytes(n) {
        if (!Number.isFinite(n) || n <= 0) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
        const v = n / Math.pow(1024, i);
        return `${v < 100 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
      }

      function downloadNode({ filename, detail, url, path, when, state, received, total }) {
        const row = document.createElement("div");
        row.className = "entry";
        row.dataset.state = state;

        const icon = document.createElement("span");
        icon.className = state === "failed" ? "ico ico-warning" : "ico ico-download";
        icon.style.opacity = state === "running" ? "0.55" : "";
        row.appendChild(icon);

        const text = document.createElement("div");
        text.className = "entry-text";
        const t = document.createElement("div");
        t.className = "entry-title";
        t.textContent = filename;
        const d = document.createElement("div");
        d.className = "entry-url";
        d.textContent = detail;
        text.append(t, d);

        // Only while it is running. A finished row shows where the file landed,
        // and a full bar under it would say nothing the row does not.
        if (state === "running") {
          const bar = document.createElement("div");
          bar.className = "dl-bar";
          const known = total > 0;
          bar.dataset.indeterminate = String(!known);
          const fill = document.createElement("div");
          fill.className = "dl-fill";
          // Clamped: a server that under-reports Content-Length would otherwise
          // push the fill past the end of its own track.
          if (known) fill.style.width = `${Math.min(100, (received / total) * 100)}%`;
          bar.appendChild(fill);
          text.appendChild(bar);
        }

        row.appendChild(text);

        if (when) {
          const w = document.createElement("div");
          w.className = "entry-when";
          w.textContent = when;
          row.appendChild(w);
        }

        // Only while it is running. A finished download has nothing to stop,
        // and the row's own click reveals it in Explorer instead.
        if (state === "running") {
          const stop = document.createElement("button");
          stop.className = "entry-remove";
          stop.title = "Cancel download";
          stop.setAttribute("aria-label", "Cancel download");
          stop.innerHTML = '<span class="ico ico-stop"></span>';
          stop.addEventListener("click", (event) => {
            event.stopPropagation();
            // No re-render here: cancelling makes the runtime finish the
            // transfer as interrupted, which emits brume://downloads like any
            // other ending, and the listener redraws from that.
            call("cancel_download", { url });
          });
          row.appendChild(stop);
        }

        // A download that failed or was cancelled can be started again. Not a
        // resume: it re-requests the whole file, which is what downloads.rs
        // does and what the label should therefore imply.
        if (state === "failed") {
          const again = document.createElement("button");
          again.className = "entry-remove";
          again.title = "Download again";
          again.setAttribute("aria-label", "Download again");
          again.innerHTML = '<span class="ico ico-reload"></span>';
          again.addEventListener("click", (event) => {
            event.stopPropagation();
            call("retry_download", { url });
          });
          row.appendChild(again);
        }

        // Only finished, successful downloads with a recorded path can be
        // revealed. The backend checks this too, and refuses a path it has no
        // record of, but there is no reason to offer a button that will fail.
        if (state === "done" && path) {
          row.title = "Show in folder";
          row.addEventListener("click", () => call("reveal_download", { path }));
        } else {
          row.title = url;
          row.style.cursor = "default";
        }

        return row;
      }

      /* Guards against an older query painting over a newer one.
       *
       * renderPanel is async and several can be in flight at once, so a slow
       * request started earlier could resolve last and leave the list showing
       * results for a query the user has already typed past. Each run takes a
       * ticket and drops its results if another has started since. */
      let panelSeq = 0;

      async function renderPanel() {
        const seq = ++panelSeq;

        for (const btn of document.querySelectorAll("#panel-views .seg-btn")) {
          btn.dataset.active = String(btn.dataset.view === panelView);
        }
        el("panel-search").placeholder =
          {
            history: "Search history",
            bookmarks: "Search bookmarks",
            downloads: "Search downloads",
          }[panelView] || "Search";
        // Clearing everything makes sense for history and for downloads, which
        // are both logs. Bookmarks are removed one at a time, because deleting
        // the lot by accident would actually hurt.
        el("panel-clear").hidden = !(panelView === "history" || panelView === "downloads");
        el("panel-clear").title =
          panelView === "downloads" ? "Clear download list" : "Clear history";
        el("panel-newfolder").hidden = panelView !== "bookmarks";
        el("panel-export").hidden = panelView !== "bookmarks";

        const list = el("panel-list");
        list.textContent = "";

        if (panelView === "settings") {
          // Search filters a list; settings is a form. Hiding the box is
          // clearer than leaving a control that silently does nothing.
          el("panel-search").hidden = true;
          await renderSettings(list, () => seq === panelSeq);
          return;
        }
        el("panel-search").hidden = false;

        const query = el("panel-search").value.trim();

        const open = (url) => {
          call("navigate", { input: url });
          closePanel();
        };

        if (panelView === "downloads") {
          const view = (await call("downloads", { limit: 200 })) || {
            active: [],
            finished: [],
          };
          if (seq !== panelSeq) return; // a newer render started; this is stale

          const q = query.toLowerCase();
          const match = (d) =>
            !q ||
            d.filename.toLowerCase().includes(q) ||
            d.url.toLowerCase().includes(q);

          const running = view.active.filter(match);
          const done = view.finished.filter(match);

          if (!running.length && !done.length) {
            list.innerHTML = `<div class="panel-empty">${
              query ? "No downloads match that." : "Nothing downloaded yet."
            }</div>`;
            return;
          }

          // In-flight first. The byte counts come from downloads.rs, which
          // watches the runtime's own download operation; Tauri's on_download
          // only reports started and finished.
          for (const d of running) {
            const known = d.total > 0;
            list.appendChild(
              downloadNode({
                filename: d.filename || d.url,
                // Three states, because a server that sends no Content-Length
                // leaves nothing to count towards. "Starting" rather than
                // "0 B of unknown", which reads like a failure.
                detail: known
                  ? `${formatBytes(d.received)} of ${formatBytes(d.total)}`
                  : d.received > 0
                    ? `${formatBytes(d.received)} so far`
                    : "Starting...",
                url: d.url,
                when: whenLabel(d.startedAt),
                state: "running",
                received: d.received,
                total: d.total,
              })
            );
          }
          for (const d of done) {
            list.appendChild(
              downloadNode({
                filename: d.filename || d.url,
                detail: d.success ? d.path || d.url : "Failed",
                url: d.url,
                path: d.path,
                when: whenLabel(d.finishedAt),
                state: d.success ? "done" : "failed",
              })
            );
          }
          return;
        }

        if (panelView === "history") {
          const rows = (await call("history", { query: query || null, limit: 300 })) || [];
          if (seq !== panelSeq) return; // a newer render started; this is stale
          if (!rows.length) {
            list.innerHTML = `<div class="panel-empty">${
              query ? "Nothing in history matches that." : "No history yet."
            }</div>`;
            return;
          }
          let lastDay = null;
          for (const v of rows) {
            // A day heading whenever the date changes. History is read by
            // "when did I see that", and a flat list of relative times gives
            // no way to scan for a particular day.
            const day = dayLabel(v.visited_at);
            if (day !== lastDay) {
              lastDay = day;
              const heading = document.createElement("div");
              heading.className = "panel-day";
              heading.textContent = day;
              list.appendChild(heading);
            }
            list.appendChild(
              entryNode({
                title: v.title,
                url: v.url,
                when: whenLabel(v.visited_at),
                onOpen: () => open(v.url),
                // The timestamp goes along too, so removing one visit to a page
                // does not take every other visit to it as well.
                onRemove: async () => {
                  await call("remove_visit", { url: v.url, visitedAt: v.visited_at });
                  renderPanel();
                },
              })
            );
          }
        } else {
          bookmarkItems = (await call("bookmarks")) || [];
          if (seq !== panelSeq) return; // a newer render started; this is stale

          if (!bookmarkItems.length) {
            list.innerHTML = `<div class="panel-empty">No bookmarks yet.</div>`;
            return;
          }

          /* Searching shows a flat list, not a tree.
           *
           * A filtered tree has to keep every ancestor of a match to stay
           * readable, so a search for one page shows the folders around it and
           * buries the thing you asked for. Folders are dropped from the
           * results too: matching one would mean either showing it empty or
           * pulling its contents in, and neither is what was asked. */
          if (query) {
            const q = query.toLowerCase();
            const hits = bookmarkItems.filter(
              (b) =>
                !b.is_folder &&
                (b.title.toLowerCase().includes(q) ||
                  b.url.toLowerCase().includes(q))
            );
            if (!hits.length) {
              list.innerHTML = `<div class="panel-empty">No bookmarks match that.</div>`;
              return;
            }
            hits.sort((a, b) => b.added_at - a.added_at);
            for (const b of hits) {
              list.appendChild(
                entryNode({
                  title: b.title,
                  url: b.url,
                  when: folderPathOf(b) || whenLabel(b.added_at),
                  onOpen: () => open(b.url),
                  onRemove: () => call("remove_bookmark", { id: b.id }),
                  onRename: (title) => call("rename_bookmark", { id: b.id, title }),
                  onMenu: (event) => openManagerMenu(event, b),
                })
              );
            }
            return;
          }

          // Tree order: each folder immediately followed by its contents.
          const rows = [];
          const walk = (parent, depth) => {
            for (const b of childrenOf(parent)) {
              rows.push({ item: b, depth });
              if (b.is_folder) walk(b.id, depth + 1);
            }
          };
          walk(null, 0);

          for (const { item, depth } of rows) {
            const kids = item.is_folder ? childrenOf(item.id).length : 0;
            const node = entryNode({
              title: item.title,
              url: item.url,
              depth,
              isFolder: item.is_folder,
              subtitle: item.is_folder
                ? `${kids} item${kids === 1 ? "" : "s"}`
                : undefined,
              when: item.is_folder ? "" : whenLabel(item.added_at),
              onOpen: () => {
                if (!item.is_folder) open(item.url);
              },
              // No re-render here. remove_bookmark emits brume://bookmarks
              // and the listener refreshes both this list and the bar, which
              // is the one path every change to the list takes.
              onRemove: () => call("remove_bookmark", { id: item.id }),
              // Renaming matters most right after an import: a page title is
              // often not what you want on a 172px strip.
              onRename: (title) => call("rename_bookmark", { id: item.id, title }),
              onMenu: (event) => openManagerMenu(event, item),
            });
            if (item.id === pendingRenameId) {
              pendingRenameId = null;
              // Opened from the bar's Rename, which sends the user here.
              node.querySelector(".entry-remove")?.click();
            }
            list.appendChild(node);
          }
        }
      }

      /** "In Reading / Later", for a search hit that lives inside folders. */
      function folderPathOf(bookmark) {
        const names = [];
        let cursor = bookmark.parent ?? null;
        // Bounded: repair_tree guarantees the chain reaches the root.
        while (cursor !== null && names.length < 12) {
          const folder = bookmarkItems.find((b) => b.id === cursor);
          if (!folder) break;
          names.unshift(folder.title);
          cursor = folder.parent ?? null;
        }
        return names.length ? `in ${names.join(" / ")}` : "";
      }

      /* The manager's per-row menu.
       *
       * Reorder and move live here rather than only on drag and drop. A
       * drag-only design cannot be driven without synthetic input, which this
       * project does not allow in tests, so it could never be verified - and a
       * menu works for anyone not using a mouse besides. */
      function openManagerMenu(at, item) {
        const siblings = childrenOf(item.parent ?? null);
        const index = siblings.findIndex((b) => b.id === item.id);

        openMenu(at, (add, separator, submenu) => {
          if (!item.is_folder) {
            add("Open", true, () => openBookmark(item, false));
            add("Open in new tab", true, () => openBookmark(item, true));
            separator();
          }
          add("Move up", index > 0, () =>
            call("reorder_bookmark", { id: item.id, index: index - 1 })
          );
          add("Move down", index >= 0 && index < siblings.length - 1, () =>
            call("reorder_bookmark", { id: item.id, index: index + 1 })
          );

          // Every folder this one could legally move into: not itself, and not
          // anything already inside it, or it would become its own ancestor.
          // The store refuses those anyway; leaving them off the menu means
          // never offering something that will only fail.
          const banned = new Set([item.id]);
          if (item.is_folder) {
            const sweep = (id) => {
              for (const kid of childrenOf(id)) {
                banned.add(kid.id);
                if (kid.is_folder) sweep(kid.id);
              }
            };
            sweep(item.id);
          }
          const targets = bookmarkItems.filter(
            (b) =>
              b.is_folder && !banned.has(b.id) && b.id !== (item.parent ?? null)
          );
          submenu("Move to", (addTo) => {
            if ((item.parent ?? null) !== null) {
              addTo("Top level", true, () =>
                call("move_bookmark", { id: item.id, parent: null })
              );
            }
            if (!targets.length) {
              addTo("No other folders", false, () => {});
              return;
            }
            for (const folder of targets) {
              addTo(folder.title, true, () =>
                call("move_bookmark", { id: item.id, parent: folder.id })
              );
            }
          });

          separator();
          add(
            item.is_folder ? "Delete folder, keep contents" : "Remove",
            true,
            () => call("remove_bookmark", { id: item.id })
          );
        });
      }

      // --- settings -------------------------------------------------------
      function group(title) {
        const g = document.createElement("div");
        g.className = "group";
        const t = document.createElement("div");
        t.className = "group-title";
        t.textContent = title;
        g.appendChild(t);
        return g;
      }

      function row(name, help) {
        const r = document.createElement("div");
        r.className = "row";
        const label = document.createElement("div");
        label.className = "row-label";
        const n = document.createElement("div");
        n.className = "row-name";
        n.textContent = name;
        label.appendChild(n);
        if (help) {
          const h = document.createElement("div");
          h.className = "row-help";
          h.textContent = help;
          label.appendChild(h);
        }
        const control = document.createElement("div");
        control.className = "row-control";
        r.append(label, control);
        return { row: r, control };
      }

      /* An on/off switch for a settings row.
       *
       * The state lives in aria-checked rather than in a variable, so what the
       * screen reader is told and what the CSS draws cannot disagree - the
       * stylesheet keys off that same attribute.
       */
      function switchControl(checked, label, onChange) {
        const toggle = document.createElement("button");
        toggle.className = "switch";
        toggle.setAttribute("role", "switch");
        toggle.setAttribute("aria-checked", String(checked));
        toggle.setAttribute("aria-label", label);
        toggle.addEventListener("click", async () => {
          const next = toggle.getAttribute("aria-checked") !== "true";
          await onChange(next);
          toggle.setAttribute("aria-checked", String(next));
        });
        return toggle;
      }

      /* `stillCurrent` reports whether this render is still the newest one.
       *
       * The three calls below are a round trip each, and the list is emptied
       * before them but appended to after. Two renders overlapping therefore
       * both cleared, then both appended, and the panel ended up with two
       * stacked copies of the settings form. Clicking a theme or engine button
       * triggers a re-render, so two quick clicks were enough to do it. */
      async function renderSettings(list, stillCurrent = () => true) {
        const [settings, engines, version] = await Promise.all([
          call("get_settings"),
          call("search_engines"),
          call("app_version"),
        ]);
        if (!settings || !engines) return;
        if (!stillCurrent()) return;

        const form = document.createElement("div");
        form.className = "settings";

        // --- general ---
        const general = group("General");
        const home = row(
          "Homepage",
          "Where new tabs open. Leave empty for Brume's own page, which makes no network requests."
        );
        const homeInput = document.createElement("input");
        homeInput.type = "text";
        homeInput.className = "text-input";
        homeInput.spellcheck = false;
        homeInput.value = settings.homepage || "";
        homeInput.placeholder = "Brume's new tab page";
        // Saved on blur rather than per keystroke: writing the file on every
        // character would be pointless churn, and Enter is not obviously a
        // "save" gesture in a form with no submit button.
        homeInput.addEventListener("blur", () =>
          call("set_homepage", { url: homeInput.value })
        );
        homeInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") homeInput.blur();
        });
        // One click back to the old behaviour. Following the search engine used
        // to be what an empty homepage meant; it is a reasonable thing to want
        // and an unreasonable thing to make the default, so it lives here.
        const useEngine = document.createElement("button");
        useEngine.className = "action";
        useEngine.textContent = "Use search engine";
        useEngine.addEventListener("click", async () => {
          const url = await call("engine_homepage");
          if (!url) return;
          homeInput.value = url;
          await call("set_homepage", { url });
        });
        home.control.append(homeInput, useEngine);
        general.appendChild(home.row);

        const theme = row("Theme", "System follows Windows.");
        const themeSeg = document.createElement("div");
        themeSeg.className = "seg";
        for (const [value, label] of [
          ["system", "System"],
          ["light", "Light"],
          ["dark", "Dark"],
        ]) {
          const b = document.createElement("button");
          b.className = "seg-btn";
          b.textContent = label;
          b.dataset.active = String((settings.theme || "dark") === value);
          b.addEventListener("click", async () => {
            applyTheme(value);
            await call("set_theme", { theme: value });
            renderPanel();
          });
          themeSeg.appendChild(b);
        }
        theme.control.appendChild(themeSeg);
        general.appendChild(theme.row);

        const bookmarksBar = row(
          "Bookmarks bar",
          "A row of saved pages under the toolbar. Ctrl+Shift+B toggles it."
        );
        bookmarksBar.control.appendChild(
          switchControl(
            settings.show_bookmarks_bar,
            "Show the bookmarks bar",
            (next) => call("set_bookmarks_bar", { show: next })
          )
        );
        general.appendChild(bookmarksBar.row);

        const tabSidebar = row(
          "Tabs down the side",
          "A vertical list on the left instead of a strip along the top, with room for the whole title. Ctrl+Shift+E toggles it."
        );
        tabSidebar.control.appendChild(
          switchControl(
            settings.show_tab_sidebar,
            "Show tabs down the side",
            (next) => call("set_tab_sidebar", { show: next })
          )
        );
        general.appendChild(tabSidebar.row);

        form.appendChild(general);

        /* --- import ---
         *
         * Only offered for browsers actually found with something in them, so
         * this section is absent on a machine with nothing to import rather
         * than showing buttons that would do nothing. */
        const sources = (await call("import_sources")) || [];
        if (sources.length) {
          const imp = group("Import bookmarks");
          for (const src of sources) {
            const r = row(
              src.name,
              `${src.count} bookmark${src.count === 1 ? "" : "s"}, with their folders, into a folder named for today.`
            );
            const status = document.createElement("span");
            status.className = "status";
            const btn = document.createElement("button");
            btn.className = "action";
            btn.textContent = "Import";
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              status.textContent = "Importing...";
              try {
                const added = await invoke("import_bookmarks", { source: src.id });
                status.textContent =
                  added === 0 ? "Already had them all" : `Added ${added}`;
              } catch (err) {
                console.error("[brume] import failed:", err);
                status.textContent = "Failed";
              } finally {
                btn.disabled = false;
              }
            });
            r.control.append(status, btn);
            imp.appendChild(r.row);
          }
          form.appendChild(imp);
        }

        // --- search ---
        const search = group("Search engine");
        for (const engine of engines) {
          const btn = document.createElement("button");
          btn.className = "engine";
          btn.dataset.selected = String(engine.id === settings.search_engine);

          const check = document.createElement("span");
          check.className = "engine-check";
          const name = document.createElement("span");
          name.className = "engine-name";
          name.textContent = engine.name;
          const host = document.createElement("span");
          host.className = "engine-host";
          try {
            host.textContent = new URL(engine.home).host;
          } catch {
            host.textContent = "";
          }

          btn.append(check, name, host);
          btn.addEventListener("click", async () => {
            await call("set_search_engine", { id: engine.id });
            renderPanel();
          });

          // Only the user's own can be removed. A built-in has nowhere to come
          // back from, so offering it would be a one-way door.
          if (engine.custom) {
            const rm = document.createElement("span");
            rm.className = "engine-remove";
            rm.title = "Remove this engine";
            rm.textContent = "Remove";
            rm.addEventListener("click", async (event) => {
              // Or removing it also selects it on the way out.
              event.stopPropagation();
              await call("remove_search_engine", { id: engine.id });
              renderPanel();
            });
            btn.appendChild(rm);
          }
          search.appendChild(btn);
        }

        /* Adding one.
         *
         * Two fields rather than a dialog, for the same reason renaming a
         * bookmark happens in place: it is a name and a URL, and a modal for
         * two short strings is more ceremony than the edit deserves. */
        const addRow = document.createElement("div");
        addRow.className = "engine-add";
        const engName = document.createElement("input");
        engName.type = "text";
        engName.placeholder = "Name";
        engName.spellcheck = false;
        const engUrl = document.createElement("input");
        engUrl.type = "text";
        engUrl.placeholder = "https://example.com/search?q={query}";
        engUrl.spellcheck = false;
        const engAdd = document.createElement("button");
        engAdd.className = "action";
        engAdd.textContent = "Add";
        const engErr = document.createElement("div");
        engErr.className = "engine-error";

        engAdd.addEventListener("click", async () => {
          engErr.textContent = "";
          try {
            // The backend validates rather than the field: it is the one that
            // has to be right, and a check here would be a second copy of the
            // rule that could disagree with it.
            await invoke("add_search_engine", {
              name: engName.value,
              template: engUrl.value,
            });
            engName.value = "";
            engUrl.value = "";
            renderPanel();
          } catch (e) {
            engErr.textContent = String(e);
          }
        });

        addRow.append(engName, engUrl, engAdd);
        search.append(addRow, engErr);
        form.appendChild(search);

        // --- privacy ---
        const privacy = group("Privacy");

        /* Remembered zoom, as one control rather than a list.
         *
         * A zoom is visible the moment you open the site, so the way to change
         * one is to go there and change it. That is unlike a permission, which
         * is a decision worth reviewing without visiting the site again, and is
         * why that one below gets a row per entry and this does not. */
        const zoomCount = (await call("zoomed_site_count")) || 0;
        const zoomRow = row(
          "Remembered zoom",
          zoomCount
            ? `${zoomCount} site${zoomCount === 1 ? "" : "s"} opens at a zoom you set. Reset one by visiting it and putting it back to 100%.`
            : "Zoom a site and Brume opens it that way next time."
        );
        const zoomBtn = document.createElement("button");
        zoomBtn.className = "action";
        zoomBtn.textContent = "Forget all";
        zoomBtn.disabled = zoomCount === 0;
        zoomBtn.addEventListener("click", async () => {
          zoomBtn.disabled = true;
          await call("clear_site_zoom");
          renderPanel();
        });
        zoomRow.control.appendChild(zoomBtn);
        privacy.appendChild(zoomRow.row);

        const siteData = row(
          "Clear site data",
          "Cookies, cache and local storage for every site. History and bookmarks are cleared from their own tabs."
        );
        const clearStatus = document.createElement("span");
        clearStatus.className = "status";
        const clearBtn = document.createElement("button");
        clearBtn.className = "action";
        clearBtn.textContent = "Clear site data";
        clearBtn.addEventListener("click", async () => {
          // No confirmation prompt, because this is recoverable in the only way
          // that matters: you sign back in. Deleting bookmarks would deserve one.
          clearBtn.disabled = true;
          clearStatus.textContent = "Clearing...";
          try {
            await invoke("clear_site_data");
            clearStatus.textContent = "Cleared";
          } catch (err) {
            console.error("[brume] clear failed:", err);
            clearStatus.textContent = "Failed";
          } finally {
            clearBtn.disabled = false;
          }
        });
        siteData.control.append(clearStatus, clearBtn);
        privacy.appendChild(siteData.row);

        /* Site permissions.
         *
         * Read from the runtime, not from anything Brume stored. Only sites you
         * have actually answered for appear: everything else is still at the
         * default, which is "ask", and listing every origin that has never
         * asked would be a list of nothing. */
        const perms = await call("list_permissions");
        const permRow = row(
          "Site permissions",
          perms && perms.length
            ? "Sites you have answered for. Reset one to be asked again."
            : "Nothing decided yet. You will be asked the first time a site wants your camera, microphone or location."
        );
        privacy.appendChild(permRow.row);

        if (perms && perms.length) {
          const list = document.createElement("div");
          list.className = "perm-list";
          // Grouped by origin so a site with three answers reads as one site.
          const byOrigin = {};
          for (const p of perms) (byOrigin[p.origin] ||= []).push(p);

          for (const [origin, entries] of Object.entries(byOrigin)) {
            for (const p of entries) {
              const line = document.createElement("div");
              line.className = "perm-line";
              const who = document.createElement("span");
              who.className = "perm-line-origin";
              who.textContent = origin;
              const what = document.createElement("span");
              what.className = "perm-line-kind";
              what.textContent = p.kind;
              const state = document.createElement("span");
              state.className = "perm-line-state";
              state.dataset.state = p.state;
              state.textContent = p.state === "allow" ? "Allowed" : "Blocked";
              const reset = document.createElement("button");
              reset.className = "action";
              reset.textContent = "Reset";
              reset.addEventListener("click", async () => {
                await call("set_permission", {
                  origin,
                  kind: p.kind,
                  state: "default",
                });
                renderPanel();
              });
              line.append(who, what, state, reset);
              list.appendChild(line);
            }
          }
          privacy.appendChild(list);
        }

        form.appendChild(privacy);

        // --- updates ---
        const updates = group("Updates");

        const ver = row("Version", `Brume ${version || "unknown"}`);
        updates.appendChild(ver.row);

        const auto = row(
          "Check for updates on launch",
          "Brume asks before installing. Updates are never applied silently."
        );
        auto.control.appendChild(
          switchControl(
            settings.auto_update,
            "Check for updates on launch",
            (next) => call("set_auto_update", { enabled: next })
          )
        );
        updates.appendChild(auto.row);

        const manual = row(
          "Check now",
          "Always available, whatever the setting above is."
        );
        const status = document.createElement("span");
        status.className = "status";
        const check = document.createElement("button");
        check.className = "action";
        check.textContent = "Check for updates";
        check.addEventListener("click", async () => {
          check.disabled = true;
          status.textContent = "Checking...";
          try {
            // The command shows its own dialog for every outcome; this only
            // clears the inline status so the button does not look stuck.
            await invoke("check_for_updates");
            status.textContent = "";
          } catch (err) {
            console.error("[brume] update check failed:", err);
            status.textContent = "";
          } finally {
            check.disabled = false;
          }
        });
        manual.control.append(status, check);
        updates.appendChild(manual.row);

        form.appendChild(updates);
        list.appendChild(form);
      }

      async function openPanel(view) {
        panelView = view;
        el("panel").hidden = false;
        el("panel-search").value = "";
        await call("set_panel", { open: true });
        renderPanel();
      }

      async function closePanel() {
        el("panel").hidden = true;
        // Hands back the parsed history. It is only worth keeping while
        // something is reading it, and it is several megabytes at the cap.
        call("release_history");
        await call("set_panel", { open: false });
      }

      el("show-history").addEventListener("click", () => openPanel("history"));
      el("show-settings").addEventListener("click", () => openPanel("settings"));
      el("panel-close").addEventListener("click", closePanel);
      /* Debounced rather than wired straight to `input`.
       *
       * Searching history is not a cheap local filter: the store keeps history
       * as append-only JSONL and has no index, so a query scans every entry, up
       * to the 20,000 cap. Until 0.6.0 it also re-read and re-parsed the file
       * each time, so typing a six-letter word did that six times; the store
       * caches the parse now while the panel is open, and `release_history`
       * drops it on close. The debounce still earns its keep, because the scan
       * and the re-render remain. Bookmarks are filtered in-page and would not
       * need this, but one path for both keeps the two views behaving alike. */
      let searchTimer = null;
      el("panel-search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderPanel, 120);
      });
      for (const btn of document.querySelectorAll("#panel-views .seg-btn")) {
        btn.addEventListener("click", () => {
          panelView = btn.dataset.view;
          el("panel-search").value = "";
          renderPanel();
        });
      }
      el("panel-newfolder").addEventListener("click", async () => {
        // Created with a placeholder name and opened straight into the rename
        // editor, rather than asking first. One less dialog, and the folder is
        // real by the time you are naming it, so cancelling leaves something
        // you can see and delete rather than nothing at all.
        const id = await call("create_folder", { title: "New folder", parent: null });
        if (id == null) return;
        pendingRenameId = id;
        renderPanel();
      });

      el("panel-export").addEventListener("click", async () => {
        const saved = await call("export_bookmarks");
        // Silent when cancelled: the user closed the dialog, they know.
        if (saved) {
          await message("Bookmarks exported.", { title: "Brume", kind: "info" });
        }
      });

      el("panel-clear").addEventListener("click", async (event) => {
        // Downloads is a short list and clearing it loses nothing but the log,
        // so it goes straight away. History is the one worth asking about.
        if (panelView === "downloads") {
          await call("clear_downloads");
          renderPanel();
          return;
        }
        event.stopPropagation();
        const rect = el("panel-clear").getBoundingClientRect();
        openMenu(
          { clientX: rect.right - 180, clientY: rect.bottom + 2 },
          (add, separator) => {
            const clear = async (since) => {
              await call("clear_history", { since });
              renderPanel();
            };
            const ago = (secs) => Math.floor(Date.now() / 1000) - secs;
            add("Clear the last hour", true, () => clear(ago(3600)));
            add("Clear the last 24 hours", true, () => clear(ago(86400)));
            add("Clear the last 7 days", true, () => clear(ago(604800)));
            separator();
            add("Clear everything", true, () => clear(null));
          }
        );
      });

      // A download starting or finishing refreshes the list, but only when it
      // is the view being looked at. Re-rendering history because a file
      // finished downloading would throw away the user's scroll position for
      // no reason.
      listen("brume://downloads", () => {
        if (!el("panel").hidden && panelView === "downloads") renderPanel();
      });

      // Every change to the bookmark list comes back through here, whether it
      // started at the star, at Ctrl+D, or at Remove in the panel. One path, so
      // the bar cannot be left showing a bookmark that is gone.
      listen("brume://bookmarks", () => {
        renderBookmarksBar();
        if (!el("panel").hidden && panelView === "bookmarks") renderPanel();
      });

      // The bar re-measures when the window width changes. A window listener
      // would not do: this webview is positioned and sized by the Rust side, so
      // what changes is the element, not the window.
      new ResizeObserver(() => layoutBookmarksBar()).observe(el("bookmarks"));

      el("bookmark").addEventListener("click", async () => {
        await call("toggle_bookmark_active");
        // The star's state comes back through brume://state, so nothing is set
        // here - the backend stays the single source of truth.
      });

      /**
       * Applies a theme to the chrome.
       *
       * Set as an attribute rather than by swapping a stylesheet, so the CSS
       * variables cascade and every component follows without knowing about it.
       */
      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme || "dark";
      }

      // --- events ---------------------------------------------------------
      listen("brume://state", (event) => render(event.payload));

      // Keyboard shortcuts arrive as events from the Rust side, because a
      // keydown listener here never fires while a page has focus: the keystroke
      // goes to the content webview, which holds no capabilities.
      //
      // They are global shortcuts registered on window focus, NOT a native
      // accelerator table. That was tried and does not work in this stack,
      // because nothing calls TranslateAcceleratorW. See shortcuts.rs, which
      // says so at length and which this comment used to contradict.
      listen("brume://focus-address", () => {
        urlInput.focus();
        urlInput.select();
      });

      listen("brume://open-panel", (event) => {
        // Anything unrecognised falls back to history rather than opening a
        // view that does not exist and rendering an empty panel.
        const known = ["history", "bookmarks", "downloads", "settings"];
        const view = known.includes(event.payload) ? event.payload : "history";
        // Pressing the same shortcut again closes it, which is what a toggle
        // shortcut is expected to do.
        if (!el("panel").hidden && panelView === view) {
          closePanel();
        } else {
          openPanel(view);
        }
      });

      /* --- find bar --------------------------------------------------------
       *
       * The search itself is WebView2's, driven from find.rs. This only owns the
       * bar: showing it, sending what was typed, and rendering the count.
       *
       * Opening and closing go through set_find_bar rather than just toggling
       * `hidden`, because the Rust side has to resize the page webview to make
       * room. Flipping the attribute alone would draw the bar over the page.
       */
      function showCount(state) {
        const box = el("find-count");
        if (!state || !el("find-input").value) {
          box.textContent = "";
          box.dataset.none = "false";
          return;
        }
        box.textContent = state.matches ? `${state.active} of ${state.matches}` : "No results";
        box.dataset.none = String(state.matches === 0);
      }

      async function openFind() {
        if (el("findbar").hidden) {
          el("findbar").hidden = false;
          await call("set_find_bar", { open: true });
        }
        // Selected, not just focused: Ctrl+F on an open bar should let you type
        // a new term straight over the old one, the way every browser does.
        el("find-input").focus();
        el("find-input").select();
      }

      async function closeFind() {
        if (el("findbar").hidden) return;
        el("findbar").hidden = true;
        el("find-input").value = "";
        showCount(null);
        // set_find_bar stops the search too, so the highlights go with the bar.
        await call("set_find_bar", { open: false });
      }

      /* Debounced for the same reason the history search is: every keystroke
       * would otherwise restart a full-document search. Sequence-guarded so a
       * slower earlier search cannot overwrite the count of a newer one. */
      let findTimer = null;

      /* Runs the current search with the current options.
       *
       * Shared by the input handler and the two toggles, so flipping "match
       * case" re-runs immediately rather than waiting for the next keystroke.
       * A toggle that only takes effect once you type again reads as broken. */
      function runFind() {
        const term = el("find-input").value;
        if (!term) {
          showCount(null);
          call("find_stop");
          return;
        }
        call("find_start", {
          query: term,
          caseSensitive: el("find-case").dataset.on === "true",
          wholeWord: el("find-word").dataset.on === "true",
        });
      }

      el("find-input").addEventListener("input", () => {
        clearTimeout(findTimer);
        findTimer = setTimeout(runFind, 150);
      });

      for (const id of ["find-case", "find-word"]) {
        el(id).addEventListener("click", () => {
          const btn = el(id);
          btn.dataset.on = String(btn.dataset.on !== "true");
          runFind();
          // Focus goes back to the field: the toggle is a modifier on what you
          // are typing, not a place to end up.
          el("find-input").focus();
        });
      }

      el("find-input").addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeFind();
        } else if (event.key === "Enter") {
          event.preventDefault();
          // Shift+Enter walks backwards, which is the universal convention.
          call(event.shiftKey ? "find_previous" : "find_next");
        }
      });

      el("find-next").addEventListener("click", () => call("find_next"));
      el("find-prev").addEventListener("click", () => call("find_previous"));
      el("find-close").addEventListener("click", closeFind);

      /* The count arrives by event, not as a return value.
       *
       * WebView2's Start is asynchronous, so the match count does not exist yet
       * when find_start returns. The Rust side reads it in the completion
       * handler and pushes it here. The bar stays blank for the moment in
       * between, which is honest: the search genuinely has not finished. */
      listen("brume://find-state", (event) => {
        // Ignore a late result for a search the user has already closed.
        if (el("findbar").hidden) return;
        showCount(event.payload);
      });

      listen("brume://open-find", openFind);

      el("reader").addEventListener("click", () => call("toggle_reader"));

      /* A page with no article to show says so.
       *
       * Reported through the title, because a content webview holds no
       * capabilities and cannot call anything: see reader.rs. Shown for a few
       * seconds rather than as a dialog, since it is information rather than a
       * decision. */
      listen("brume://reader-state", () => {
        const btn = el("reader");
        const was = btn.title;
        btn.title = "No article found on this page";
        btn.dataset.failed = "true";
        setTimeout(() => {
          btn.title = was;
          delete btn.dataset.failed;
        }, 2600);
      });

      el("new-tab").addEventListener("click", () => call("open_tab", { url: null }));
      // Right-click on the new tab button offers the window variants. The strip
      // has no menu bar to hang them off, and Ctrl+N alone leaves them
      // undiscoverable for anyone who does not already know the shortcut.
      el("new-tab").addEventListener("contextmenu", (event) => {
        event.preventDefault();
        openMenu(event, (add, separator) => {
          add("New tab", true, () => call("open_tab", { url: null }));
          add("New private tab", true, () =>
            call("open_tab", { url: null, private: true })
          );
          separator();
          add("New window", true, () => call("open_window", {}));
          add("New private window", true, () =>
            call("open_window", { private: true })
          );
        });
      });

      // A wheel over the strip scrolls it sideways. There is no vertical axis
      // here to give the gesture to, and reaching a tab should not require
      // finding a scrollbar that is deliberately not drawn.
      el("tab-scroll").addEventListener(
        "wheel",
        (event) => {
          if (event.deltaY === 0) return;
          event.preventDefault();
          el("tab-scroll").scrollLeft += event.deltaY;
        },
        { passive: false }
      );

      el("back").addEventListener("click", () => call("go_back"));
      el("forward").addEventListener("click", () => call("go_forward"));
      el("home").addEventListener("click", () => call("go_home"));
      el("zoom").addEventListener("click", () => call("reset_zoom"));
      el("reload").addEventListener("click", () =>
        call(loading ? "stop_loading" : "reload")
      );

      /* --- site info --------------------------------------------------------
       *
       * What the padlock has always implied but never said. Two questions: is
       * this connection encrypted, and what has this site been allowed.
       *
       * Both answers come from somewhere authoritative rather than from
       * anything the chrome remembers. The scheme is read off the live URL, and
       * the permissions from the runtime through list_permissions, so this
       * cannot claim a site is blocked while the engine allows it.
       */
      let siteInfoOrigin = "";

      /** Scheme and host, matching how permissions.rs keys an origin. */
      function originOf(url) {
        try {
          const u = new URL(url);
          return `${u.protocol}//${u.host.replace(/^www\./, "")}`;
        } catch {
          return "";
        }
      }

      async function closeSiteInfo() {
        const box = el("siteinfo");
        if (box.hidden) return;
        box.hidden = true;
        box.textContent = "";
        await syncOverlay();
      }

      async function openSiteInfo() {
        const box = el("siteinfo");
        if (!box.hidden) return closeSiteInfo(); // the padlock toggles

        const url = urlInput.value || "";
        const origin = originOf(url);
        if (!origin) return; // nothing loaded worth describing
        siteInfoOrigin = origin;

        box.textContent = "";
        const who = document.createElement("div");
        who.className = "si-origin";
        who.textContent = origin;

        const secure = document.createElement("div");
        secure.className = "si-secure";
        const isHttps = url.startsWith("https://");
        secure.dataset.secure = String(isHttps);
        const icon = document.createElement("span");
        icon.className = isHttps ? "ico ico-lock" : "ico ico-warning";
        const words = document.createElement("span");
        words.textContent = isHttps
          ? "Connection is encrypted"
          : "Not encrypted. Anyone on the network can read this.";
        secure.append(icon, words);
        box.append(who, secure);

        const heading = document.createElement("div");
        heading.className = "si-heading";
        heading.textContent = "Permissions";
        box.appendChild(heading);

        box.hidden = false;
        // Positioned under the padlock, then measured. Shown first because a
        // hidden element has no height to report.
        const anchor = document.querySelector(".address").getBoundingClientRect();
        box.style.left = `${Math.round(anchor.left)}px`;
        await syncOverlay();

        // Fetched after painting the certain parts, so the popover appears at
        // once rather than waiting on a round trip to say anything at all.
        const all = (await call("list_permissions")) || [];
        if (box.hidden || siteInfoOrigin !== origin) return; // closed or moved on
        const mine = all.filter((p) => originOf(p.origin) === origin);

        if (!mine.length) {
          const none = document.createElement("div");
          none.className = "si-none";
          none.textContent =
            "Nothing decided yet. You will be asked the first time this site wants your camera, microphone or location.";
          box.appendChild(none);
        } else {
          for (const p of mine) {
            const row = document.createElement("div");
            row.className = "si-perm";
            const kind = document.createElement("span");
            kind.className = "si-perm-kind";
            kind.textContent = p.kind;
            const state = document.createElement("span");
            state.className = "si-perm-state";
            state.dataset.state = p.state;
            state.textContent = p.state === "allow" ? "Allowed" : "Blocked";
            const reset = document.createElement("button");
            reset.className = "action";
            reset.textContent = "Reset";
            reset.addEventListener("click", async () => {
              await call("set_permission", {
                origin: p.origin,
                kind: p.kind,
                state: "default",
              });
              closeSiteInfo();
            });
            row.append(kind, state, reset);
            box.appendChild(row);
          }
        }
        await syncOverlay();
      }

      el("scheme-icon").addEventListener("click", (event) => {
        event.stopPropagation();
        openSiteInfo();
      });

      /* --- tab search -------------------------------------------------------
       *
       * Ctrl+Shift+A. Filters the tabs already in `brume://state`, so it needs
       * nothing from the backend: the list it searches is the same one the strip
       * renders, and the two cannot disagree.
       *
       * Worth having because the strip scrolls now. Past about 26 tabs on a
       * 1200px window most of them are off screen, and a tab you cannot see is
       * one you cannot click.
       */
      let tabSearchRows = [];
      let tabSearchIndex = 0;
      let lastTabs = [];

      async function closeTabSearch() {
        const box = el("tabsearch");
        if (box.hidden) return;
        box.hidden = true;
        el("tabsearch-input").value = "";
        tabSearchRows = [];
        await syncOverlay();
      }

      function paintTabSearch() {
        [...el("tabsearch-list").querySelectorAll(".ts-row")].forEach((row, i) => {
          row.dataset.on = String(i === tabSearchIndex);
        });
      }

      async function renderTabSearch() {
        const q = el("tabsearch-input").value.trim().toLowerCase();
        tabSearchRows = lastTabs.filter(
          (t) =>
            !q ||
            (t.title || "").toLowerCase().includes(q) ||
            (t.url || "").toLowerCase().includes(q)
        );
        // Clamped rather than reset: typing a character that narrows the list
        // should not throw away where you had got to with the arrow keys.
        tabSearchIndex = Math.min(tabSearchIndex, Math.max(0, tabSearchRows.length - 1));

        const list = el("tabsearch-list");
        list.textContent = "";
        if (!tabSearchRows.length) {
          list.innerHTML = '<div class="tabsearch-empty">No tabs match that.</div>';
          await syncOverlay();
          return;
        }

        for (const [i, t] of tabSearchRows.entries()) {
          const row = document.createElement("div");
          row.className = "ts-row";
          row.appendChild(faviconNode(t.url, false));
          const title = document.createElement("span");
          title.className = "ts-title";
          title.textContent = t.title || t.url;
          const url = document.createElement("span");
          url.className = "ts-url";
          url.textContent = t.url;
          row.append(title, url);
          if (t.active) {
            const here = document.createElement("span");
            here.className = "ts-current";
            here.textContent = "current";
            row.appendChild(here);
          }
          row.addEventListener("mousedown", (e) => {
            e.preventDefault();
            commitTabSearch(i);
          });
          row.addEventListener("mouseenter", () => {
            tabSearchIndex = i;
            paintTabSearch();
          });
          list.appendChild(row);
        }
        paintTabSearch();
        await syncOverlay();
      }

      function commitTabSearch(index) {
        const tab = tabSearchRows[index];
        closeTabSearch();
        if (tab) call("activate_tab", { id: tab.id });
      }

      async function openTabSearch() {
        const box = el("tabsearch");
        if (!box.hidden) return closeTabSearch(); // the shortcut toggles
        box.hidden = false;
        el("tabsearch-input").value = "";
        tabSearchIndex = 0;
        await renderTabSearch();
        el("tabsearch-input").focus();
      }

      el("tabsearch-input").addEventListener("input", renderTabSearch);

      el("tabsearch-input").addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (!tabSearchRows.length) return;
          const step = event.key === "ArrowDown" ? 1 : -1;
          tabSearchIndex =
            (tabSearchIndex + step + tabSearchRows.length) % tabSearchRows.length;
          paintTabSearch();
        } else if (event.key === "Enter") {
          event.preventDefault();
          commitTabSearch(tabSearchIndex);
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeTabSearch();
        }
      });

      el("tabsearch-input").addEventListener("blur", closeTabSearch);

      listen("brume://open-tab-search", openTabSearch);

      /* --- permission prompts ----------------------------------------------
       *
       * The runtime is holding the page open on a deferral while this is up, so
       * every path out of here has to answer. Dismissing counts as an answer:
       * block once, without remembering it.
       *
       * Queued rather than stacked. A site asking for the camera and the
       * microphone raises two events, and two prompts on screen at once is a
       * question nobody reads properly.
       */
      const permissionQueue = [];

      const PERMISSION_WORDING = {
        camera: "use your camera",
        microphone: "use your microphone",
        location: "know your location",
        notifications: "send you notifications",
        sensors: "read your device's motion sensors",
        clipboard: "read your clipboard",
        downloads: "download several files at once",
        fonts: "see the fonts installed on your computer",
        windows: "manage windows across your screens",
        autoplay: "play sound without you pressing play",
        other: "use a capability of your device",
      };

      async function showNextPermission() {
        const box = el("permission");
        const req = permissionQueue[0];
        if (!req) {
          if (!box.hidden) {
            box.hidden = true;
            box.textContent = "";
            await syncOverlay();
          }
          return;
        }

        box.textContent = "";
        const origin = document.createElement("div");
        origin.className = "perm-origin";
        origin.textContent = req.origin;
        const ask = document.createElement("div");
        ask.className = "perm-ask";
        ask.textContent = `wants to ${PERMISSION_WORDING[req.kind] || PERMISSION_WORDING.other}.`;
        box.append(origin, ask);

        if (!req.userInitiated) {
          const note = document.createElement("div");
          note.className = "perm-note";
          note.textContent = "You did not click anything to ask for this.";
          box.appendChild(note);
        }

        const actions = document.createElement("div");
        actions.className = "perm-actions";
        for (const [label, kind, allow] of [
          ["Block", "block", false],
          ["Allow", "allow", true],
        ]) {
          const b = document.createElement("button");
          b.className = "perm-btn";
          b.dataset.kind = kind;
          b.textContent = label;
          // Both are remembered. An answer you have to give again every visit
          // trains people to click whatever makes the prompt go away.
          b.addEventListener("click", () => answerPermission(allow, true));
          actions.appendChild(b);
        }
        box.appendChild(actions);

        // Under the padlock, which is the part of the chrome that already means
        // "about this site".
        const bar = document.querySelector(".address").getBoundingClientRect();
        box.style.left = `${Math.round(bar.left)}px`;
        box.hidden = false;
        await syncOverlay();
      }

      async function answerPermission(allow, remember) {
        const req = permissionQueue.shift();
        if (!req) return;
        await call("answer_permission", { id: req.id, allow, remember });
        await showNextPermission();
      }

      listen("brume://permission", (event) => {
        permissionQueue.push(event.payload);
        // Only draw when this is the one at the front; otherwise it waits.
        if (permissionQueue.length === 1) showNextPermission();
      });

      /* --- address bar suggestions -----------------------------------------
       *
       * The list is an overlay, not another bar. The Rust side grows the chrome
       * webview by exactly the height measured here and raises it above the
       * page, so the dropdown covers the top of the page rather than pushing it
       * down. Typing must not reflow the page on every keystroke.
       *
       * `suggestRows[selected]` is the source of truth for what Enter does.
       * Reading it back out of the DOM would mean the highlight and the action
       * could disagree, which is the one thing an address bar must never do.
       */
      let suggestRows = [];
      let suggestIndex = -1;
      let suggestSeq = 0;

      /* Tells the Rust side how far down the lowest open overlay reaches.
       *
       * One number for every overlay, because only one of them can be the
       * lowest and only this document knows what it drew. The bottom edge
       * rather than a height, so the bar heights stay in browser.rs and this
       * file never needs its own copy of them to subtract. */
      async function syncOverlay() {
        const open = [
          el("suggest"),
          el("permission"),
          el("tabsearch"),
          el("siteinfo"),
          // Brume's own menus are HTML in this webview too, so they need the
          // chrome raised exactly as the dropdowns do. Left out until 0.6.0,
          // which is why a long menu was cut off at the toolbar.
          el("ctx-menu"),
        ].filter((b) => !b.hidden);
        const bottom = open.reduce(
          (low, b) => Math.max(low, Math.ceil(b.getBoundingClientRect().bottom)),
          0
        );
        await call("set_chrome_overlay", { bottom: bottom ? bottom + 6 : 0 });
      }

      async function closeSuggest() {
        suggestRows = [];
        suggestIndex = -1;
        const box = el("suggest");
        if (box.hidden) return;
        box.hidden = true;
        box.textContent = "";
        await syncOverlay();
      }

      function paintSuggest() {
        const box = el("suggest");
        [...box.querySelectorAll(".sug")].forEach((row, i) => {
          row.dataset.on = String(i === suggestIndex);
        });
      }

      async function renderSuggest(query) {
        const seq = ++suggestSeq;
        const typed = query.trim();
        if (!typed) return closeSuggest();

        const rows = (await call("suggest", { query: typed, limit: 8 })) || [];
        if (seq !== suggestSeq) return; // a newer keystroke already ran

        // Always offer the search itself, last. Without it a query that happens
        // to match history has no visible way to become a plain search.
        rows.push({ kind: "search", title: `Search for "${typed}"`, url: typed, at: 0 });

        suggestRows = rows;
        suggestIndex = -1;

        const box = el("suggest");
        box.textContent = "";
        for (const [i, r] of rows.entries()) {
          const row = document.createElement("div");
          row.className = "sug";
          row.dataset.kind = r.kind;
          row.innerHTML =
            '<span class="sug-icon"></span>' +
            `<span class="sug-title"></span>` +
            (r.kind === "search" ? "" : `<span class="sug-url"></span>`);
          row.querySelector(".sug-title").textContent = r.title || r.url;
          const u = row.querySelector(".sug-url");
          if (u) u.textContent = r.url;
          // mousedown, not click: the input's blur fires first on a click and
          // would close the list out from under the pointer.
          row.addEventListener("mousedown", (e) => {
            e.preventDefault();
            commitSuggest(i);
          });
          row.addEventListener("mouseenter", () => {
            suggestIndex = i;
            paintSuggest();
          });
          box.appendChild(row);
        }

        // Line the list up with the address bar, then tell Rust how tall it is.
        const bar = document.querySelector(".address").getBoundingClientRect();
        box.style.left = `${Math.round(bar.left)}px`;
        box.style.width = `${Math.round(bar.width)}px`;
        box.hidden = false;
        paintSuggest();

        // Measured after showing: a hidden element has no height to report, and
        // guessing a row height here would be a second contract to keep in step.
        await syncOverlay();
      }

      function commitSuggest(index) {
        const row = suggestRows[index];
        editing = false;
        closeSuggest();
        urlInput.blur();
        call("navigate", { input: row ? row.url : urlInput.value });
      }

      urlInput.addEventListener("focus", () => {
        editing = true;
        urlInput.select(); // typing replaces rather than appends
      });

      urlInput.addEventListener("blur", () => {
        editing = false;
        closeSuggest();
        // Put back whatever is actually loaded, discarding an abandoned edit.
        call("browser_state").then((s) => s && render(s));
      });

      urlInput.addEventListener("input", () => renderSuggest(urlInput.value));

      urlInput.addEventListener("keydown", (event) => {
        const open = !el("suggest").hidden && suggestRows.length > 0;

        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (!open) return;
          event.preventDefault();
          const step = event.key === "ArrowDown" ? 1 : -1;
          // Wraps through -1, which is "back to what I actually typed".
          const n = suggestRows.length;
          suggestIndex = suggestIndex + step;
          if (suggestIndex >= n) suggestIndex = -1;
          if (suggestIndex < -1) suggestIndex = n - 1;
          paintSuggest();
          return;
        }

        if (event.key === "Enter") {
          event.preventDefault();
          if (open && suggestIndex >= 0) {
            commitSuggest(suggestIndex);
          } else {
            editing = false;
            closeSuggest();
            urlInput.blur();
            call("navigate", { input: urlInput.value });
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          // First Escape dismisses the list, second gives up on the edit. Two
          // stages because losing a half-typed address to a stray key is worse
          // than pressing Escape twice.
          if (open) {
            closeSuggest();
          } else {
            editing = false;
            urlInput.blur();
          }
        }
      });

      // --- boot -----------------------------------------------------------
      // Theme first, so the chrome never paints in the wrong palette and then
      // corrects itself a frame later.
      call("get_settings").then((s) => s && applyTheme(s.theme));
      call("browser_state").then((s) => s && render(s));
    </script>
  </body>
</html>
