<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brume</title>

    <!--
      This document is the browser chrome, not a page. It occupies a fixed strip
      at the top of the window - 36px of tab strip over 40px of toolbar - and the
      page the user is looking at is a separate sibling webview underneath, one
      per tab. See src-tauri/src/browser.rs.

      The heights here and the constants in browser.rs must agree.
    -->
    <link rel="stylesheet" href="assets/brand/css/tokens.css" />

    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/brand/fonts/archivo-latin-var.woff2") format("woff2-variations");
        font-weight: 300 700;
        font-display: block;
      }

      /* Dark is the default rather than `system`, because Brume's chrome is
         drawn around Ink and the brand is dark-first. Every surface colour is a
         variable so the light theme is a value swap, not a second stylesheet. */
      :root {
        color-scheme: dark;
        --bg: var(--brume-ink);
        --fg: var(--brume-paper);
        --fg-muted: var(--brume-haar-dark);
        --hairline: #232a30;
        --surface: #171d24;
        --surface-hover: #1e252d;
        --elev-1: #212a33; /* hover on a flat control */
        --elev-2: #2b333c; /* pressed, or hover on an already-raised control */
        --input-bg: #0e1319;
        --border-strong: #2d363f;
        --switch-track: #2a323a;
        --switch-knob: #7d8b95;

        --tab-strip-h: 36px;
        --toolbar-h: 40px;
      }

      :root[data-theme="light"],
      :root[data-theme="system"] {
        color-scheme: light;
        --bg: var(--brume-paper);
        --fg: var(--brume-ink);
        --fg-muted: var(--brume-haar);
        --hairline: #dee1e4;
        --surface: #ffffff;
        --surface-hover: #eaecee;
        --elev-1: #e4e7e9;
        --elev-2: #d6dade;
        --input-bg: #ffffff;
        --border-strong: #c3c9ce;
        --switch-track: #c3c9ce;
        --switch-knob: #ffffff;
      }

      /* `system` follows the OS, so it has to fall back to the dark values when
         the OS is dark - the light block above claims it unconditionally. */
      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          color-scheme: dark;
          --bg: var(--brume-ink);
          --fg: var(--brume-paper);
          --fg-muted: var(--brume-haar-dark);
          --hairline: #232a30;
          --surface: #171d24;
          --surface-hover: #1e252d;
          --elev-1: #212a33;
          --elev-2: #2b333c;
          --input-bg: #0e1319;
          --border-strong: #2d363f;
          --switch-track: #2a323a;
          --switch-knob: #7d8b95;
        }
      }

      * {
        box-sizing: border-box;
      }

      /* Must outrank the components' own display rules.
         `[hidden]` is only a UA default of `display: none`, so any element given
         an explicit display - `.btn` is `display: grid` - ignores it completely
         and stays on screen while reporting `hidden === true`. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden; /* the strip is a fixed height; nothing may scroll it */
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: var(--text-ui);
        line-height: var(--lh-ui);
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      /* --- tab strip ----------------------------------------------------- */
      .tabs {
        flex: 0 0 var(--tab-strip-h);
        display: flex;
        align-items: stretch;
        gap: 1px;
        padding: 5px 6px 0;
        min-width: 0;
        overflow: hidden;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1 1 0;
        /* Tabs shrink as more open, but never past the point where the title is
           gone entirely - beyond that they stop shrinking and simply clip. */
        min-width: 44px;
        max-width: 220px;
        padding: 0 8px 0 10px;
        border-radius: var(--radius) var(--radius) 0 0;
        background: transparent;
        color: var(--fg-muted);
        border: 0;
        font: inherit;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .tab:hover {
        background: var(--elev-1);
        color: var(--fg);
      }
      .tab[data-active="true"] {
        background: var(--surface);
        color: var(--fg);
      }

      .tab-favicon {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        border-radius: 2px;
        object-fit: contain;
      }
      /* Shown when a site has no favicon, or it fails to load. */
      .tab-favicon-fallback {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0.45;
        -webkit-mask: url("assets/brand/icons/tab.svg") no-repeat center / contain;
        mask: url("assets/brand/icons/tab.svg") no-repeat center / contain;
      }

      .tab-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: left;
        font-size: 12px;
      }

      .tab-close {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 17px;
        height: 17px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: inherit;
        cursor: default;
        opacity: 0;
        transition: opacity 110ms ease, background 110ms ease;
      }
      /* The close button appears on hover or on the active tab. Always-visible
         close buttons on every tab turn the strip into a row of targets to
         misclick. */
      .tab:hover .tab-close,
      .tab[data-active="true"] .tab-close {
        opacity: 0.7;
      }
      .tab-close:hover {
        opacity: 1;
        background: var(--elev-2);
      }
      .tab-close svg {
        width: 9px;
        height: 9px;
      }

      .new-tab {
        flex: 0 0 auto;
        align-self: center;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-left: 3px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-muted);
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .new-tab:hover {
        background: var(--surface-hover);
        color: var(--fg);
      }

      /* --- toolbar ------------------------------------------------------- */
      .toolbar {
        flex: 0 0 var(--toolbar-h);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 8px;
        background: var(--surface);
        min-height: 0;
      }

      .btn {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        cursor: default;
        transition: background 110ms ease, opacity 110ms ease;
      }
      .btn:hover:not(:disabled) {
        background: var(--elev-1);
      }
      .btn:disabled {
        /* Dimmed rather than hidden: a button that disappears makes the toolbar
           shift under the pointer, which is worse than one visibly unavailable. */
        opacity: 0.28;
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* Icons are painted as masks so they inherit currentColor and survive the
         disabled state's opacity cleanly. */
      .ico {
        width: 15px;
        height: 15px;
        background: currentColor;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
      }
      .ico-back { -webkit-mask-image: url("assets/brand/icons/back.svg"); mask-image: url("assets/brand/icons/back.svg"); }
      .ico-forward { -webkit-mask-image: url("assets/brand/icons/forward.svg"); mask-image: url("assets/brand/icons/forward.svg"); }
      .ico-reload { -webkit-mask-image: url("assets/brand/icons/reload.svg"); mask-image: url("assets/brand/icons/reload.svg"); }
      .ico-stop { -webkit-mask-image: url("assets/brand/icons/close.svg"); mask-image: url("assets/brand/icons/close.svg"); }
      .ico-lock { -webkit-mask-image: url("assets/brand/icons/lock.svg"); mask-image: url("assets/brand/icons/lock.svg"); }
      .ico-search { -webkit-mask-image: url("assets/brand/icons/search.svg"); mask-image: url("assets/brand/icons/search.svg"); }
      .ico-plus { -webkit-mask-image: url("assets/brand/icons/plus.svg"); mask-image: url("assets/brand/icons/plus.svg"); }
      .ico-bookmark { -webkit-mask-image: url("assets/brand/icons/bookmark.svg"); mask-image: url("assets/brand/icons/bookmark.svg"); }
      .ico-history { -webkit-mask-image: url("assets/brand/icons/history.svg"); mask-image: url("assets/brand/icons/history.svg"); }
      .ico-trash { -webkit-mask-image: url("assets/brand/icons/trash.svg"); mask-image: url("assets/brand/icons/trash.svg"); }
      .ico-settings { -webkit-mask-image: url("assets/brand/icons/settings.svg"); mask-image: url("assets/brand/icons/settings.svg"); }
      .ico-check { -webkit-mask-image: url("assets/brand/icons/check.svg"); mask-image: url("assets/brand/icons/check.svg"); }

      /* The star fills in when the page is bookmarked. Lamplight is the accent
         the brand allows once per screen, and this is where it earns it: a
         single, deliberate signal that this page is saved. */
      .btn[data-on="true"] {
        color: var(--brume-lamplight);
      }

      /* --- address bar --------------------------------------------------- */
      .address {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        margin: 0 6px;
        padding: 0 11px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--input-bg);
        min-width: 0;
        transition: border-color 110ms ease;
      }
      .address:hover {
        border-color: var(--border-strong);
      }
      .address:focus-within {
        border-color: transparent;
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .scheme {
        flex: 0 0 auto;
        width: 12px;
        height: 12px;
        color: var(--fg-muted);
      }

      #url {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #url:focus {
        outline: none;
      }
      #url::placeholder {
        color: var(--fg-muted);
        opacity: 0.7;
      }

      /* --- panel --------------------------------------------------------- */
      .panel {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
      }

      .panel-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--hairline);
      }

      .seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius);
        background: var(--surface);
      }
      .seg-btn {
        padding: 5px 13px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .seg-btn:hover {
        color: var(--fg);
      }
      .seg-btn[data-active="true"] {
        background: var(--elev-2);
        color: var(--fg);
      }

      #panel-search {
        flex: 1 1 auto;
        min-width: 0;
        height: 28px;
        padding: 0 11px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--input-bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #panel-search:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }

      .panel-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 6px 8px 16px;
        min-height: 0;
      }

      .entry {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 8px 10px;
        border-radius: var(--radius);
        cursor: default;
      }
      .entry:hover {
        background: var(--surface);
      }

      .entry-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .entry-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .entry-url {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-size: 11.5px;
        font-family: var(--font-mono);
      }
      .entry-when {
        flex: 0 0 auto;
        color: var(--fg-muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      .entry-remove {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg-muted);
        cursor: default;
        opacity: 0;
      }
      .entry:hover .entry-remove {
        opacity: 1;
      }
      .entry-remove:hover {
        background: var(--elev-2);
        color: var(--fg);
      }

      /* --- settings form -------------------------------------------------- */
      .settings {
        max-width: 620px;
        padding: 8px 4px 40px;
      }

      .group + .group {
        margin-top: 30px;
      }

      .group-title {
        margin-bottom: 12px;
        color: var(--fg-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 11px 10px;
        border-radius: var(--radius);
      }
      .row + .row {
        border-top: 1px solid var(--hairline);
      }
      .row-label {
        flex: 1 1 auto;
        min-width: 0;
      }
      .row-name {
        font-size: 13px;
      }
      .row-help {
        margin-top: 3px;
        color: var(--fg-muted);
        font-size: 11.5px;
        line-height: 16px;
      }
      .row-control {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .text-input {
        width: 290px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--input-bg);
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 11.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      .text-input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }

      .action {
        height: 28px;
        padding: 0 13px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
        transition: background 110ms ease;
      }
      .action:hover {
        background: var(--elev-1);
      }
      .action:disabled {
        opacity: 0.5;
      }

      /* Same switch as the installer shell, so the two surfaces of Brume that
         ask this question look like the same product. */
      .switch {
        position: relative;
        width: 36px;
        height: 21px;
        padding: 0;
        border: 0;
        border-radius: 11px;
        background: var(--switch-track);
        cursor: default;
        transition: background 160ms ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--switch-knob);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.3, 1), background 160ms ease;
      }
      .switch[aria-checked="true"] {
        background: var(--brume-haar-dark);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(15px);
        background: var(--brume-ink);
      }
      .switch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .engine {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        text-align: left;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .engine:hover {
        background: var(--surface);
        color: var(--fg);
      }
      .engine[data-selected="true"] {
        color: var(--fg);
      }
      .engine-check {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0;
        -webkit-mask: url("assets/brand/icons/check.svg") no-repeat center / contain;
        mask: url("assets/brand/icons/check.svg") no-repeat center / contain;
      }
      .engine[data-selected="true"] .engine-check {
        opacity: 1;
      }
      .engine-name {
        flex: 0 0 auto;
        font-size: 13px;
      }
      .engine-host {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-family: var(--font-mono);
        font-size: 11px;
        text-align: right;
      }

      .status {
        color: var(--fg-muted);
        font-size: 11.5px;
      }

      .panel-empty {
        padding: 40px 12px;
        text-align: center;
        color: var(--fg-muted);
        font-size: 13px;
      }

      /* --- loading indicator --------------------------------------------- */
      /* A 2px rule along the bottom edge of the chrome. Indeterminate, because
         WebView2 reports load start and finish but no progress fraction - a bar
         claiming a percentage would be inventing it. */
      .progress {
        flex: 0 0 2px;
        position: relative;
        overflow: hidden;
      }
      .progress[data-loading="true"]::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 32%;
        background: linear-gradient(90deg, transparent, var(--brume-haar-dark), transparent);
        animation: sweep 1.05s ease-in-out infinite;
      }
      @keyframes sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(420%); }
      }
    </style>
  </head>

  <body>
    <div class="tabs" id="tabs"></div>

    <div class="toolbar">
      <button class="btn" id="back" title="Back" aria-label="Back" disabled>
        <span class="ico ico-back"></span>
      </button>
      <button class="btn" id="forward" title="Forward" aria-label="Forward" disabled>
        <span class="ico ico-forward"></span>
      </button>
      <button class="btn" id="reload" title="Reload" aria-label="Reload">
        <span class="ico ico-reload" id="reload-icon"></span>
      </button>

      <div class="address">
        <span class="ico scheme ico-search" id="scheme-icon"></span>
        <input
          type="text"
          id="url"
          placeholder="Search, or enter an address"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
        />
      </div>

      <button class="btn" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page">
        <span class="ico ico-bookmark"></span>
      </button>
      <button class="btn" id="show-history" title="History" aria-label="History">
        <span class="ico ico-history"></span>
      </button>
      <button class="btn" id="show-settings" title="Settings" aria-label="Settings">
        <span class="ico ico-settings"></span>
      </button>
    </div>

    <div class="progress" id="progress" data-loading="false"></div>

    <!--
      The panel occupies the space the page normally would. The Rust side grows
      this webview to the full window height while it is open, so everything
      privileged stays inside the one webview that holds capabilities.
    -->
    <section class="panel" id="panel" hidden>
      <header class="panel-head">
        <div class="seg" role="tablist">
          <button class="seg-btn" data-view="history" role="tab">History</button>
          <button class="seg-btn" data-view="bookmarks" role="tab">Bookmarks</button>
          <button class="seg-btn" data-view="settings" role="tab">Settings</button>
        </div>
        <input
          type="text"
          id="panel-search"
          placeholder="Search"
          spellcheck="false"
          autocomplete="off"
        />
        <button class="btn" id="panel-clear" title="Clear history" aria-label="Clear history">
          <span class="ico ico-trash"></span>
        </button>
        <button class="btn" id="panel-close" title="Close" aria-label="Close">
          <span class="ico ico-stop"></span>
        </button>
      </header>
      <div class="panel-list" id="panel-list"></div>
    </section>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const { message } = window.__TAURI__.dialog;

      const el = (id) => document.getElementById(id);
      const urlInput = el("url");

      let loading = false;

      /**
       * True while the user is typing in the address bar.
       *
       * State events keep arriving during a page load, and overwriting the field
       * mid-keystroke is the single most infuriating thing an address bar can
       * do. Every real browser suppresses this; so does Brume.
       */
      let editing = false;

      /**
       * Invoke a command, surfacing any failure.
       *
       * A rejected promise with no handler is invisible - the button appears
       * dead, which is indistinguishable from a broken one and impossible to
       * report usefully.
       */
      function call(command, args) {
        return invoke(command, args).catch((err) => {
          console.error(`[brume] ${command} failed:`, err);
          message(String(err), { title: "Brume", kind: "error" });
        });
      }

      /* Origins already known to have no /favicon.ico.
       *
       * Without this the strip flickers. renderTabs rebuilds itself on every
       * state publish, and there are three or four of those per navigation, so
       * a site with no favicon went empty-box then fallback-mark each time. A
       * 404 is also frequently sent with no cache headers, so the request went
       * out again on every rebuild rather than being served from cache.
       *
       * Session-only and unbounded on purpose: it holds origins already visited
       * this session, which the history store knows anyway, and it disappears
       * on quit. */
      const faviconMisses = new Set();

      /** Favicon URL for a page, or null when there is nothing sensible to try. */
      function faviconFor(pageUrl) {
        try {
          const u = new URL(pageUrl);
          if (u.protocol !== "http:" && u.protocol !== "https:") return null;
          if (faviconMisses.has(u.origin)) return null;
          // Fetched straight from the site itself. Routing this through a
          // third-party favicon service would hand that service a log of every
          // domain visited, which is precisely what Brume is trying to avoid.
          return `${u.origin}/favicon.ico`;
        } catch {
          return null;
        }
      }

      /* Builds the favicon element for a tab or a list row.
       *
       * `lazy` matters more than it looks. The history panel renders up to 300
       * rows at once, and an eager <img> per row means a request to every domain
       * in your history the moment the panel opens: slow, and a burst of traffic
       * announcing to each site that you just opened it. Deferring to what is
       * actually on screen cuts that to the handful of visible rows.
       */
      function faviconNode(pageUrl, lazy) {
        const fallback = () => {
          const span = document.createElement("span");
          span.className = "tab-favicon-fallback";
          return span;
        };

        const src = faviconFor(pageUrl);
        if (!src) return fallback();

        const img = document.createElement("img");
        img.className = "tab-favicon";
        img.src = src;
        img.alt = "";
        if (lazy) img.loading = "lazy";
        img.addEventListener("error", () => {
          // Remembered, so neither this render nor the next one asks again.
          try {
            faviconMisses.add(new URL(pageUrl).origin);
          } catch {
            /* unparseable, nothing to remember */
          }
          img.replaceWith(fallback());
        });
        return img;
      }

      // --- tab strip ------------------------------------------------------
      function renderTabs(tabs) {
        const strip = el("tabs");
        strip.textContent = "";

        for (const tab of tabs) {
          const node = document.createElement("div");
          node.className = "tab";
          node.dataset.active = String(tab.active);
          node.title = tab.title;
          node.addEventListener("click", () => call("activate_tab", { id: tab.id }));

          // Eager: the strip is always on screen and only ever holds a few.
          node.appendChild(faviconNode(tab.url, false));

          const title = document.createElement("span");
          title.className = "tab-title";
          title.textContent = tab.title;
          node.appendChild(title);

          const close = document.createElement("button");
          close.className = "tab-close";
          close.title = "Close tab";
          close.setAttribute("aria-label", "Close tab");
          close.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg>';
          close.addEventListener("click", (event) => {
            // Without this the click also activates the tab being closed.
            event.stopPropagation();
            call("close_tab", { id: tab.id });
          });
          node.appendChild(close);

          strip.appendChild(node);
        }

        const add = document.createElement("button");
        add.className = "new-tab";
        add.title = "New tab";
        add.setAttribute("aria-label", "New tab");
        add.innerHTML = '<span class="ico ico-plus"></span>';
        add.addEventListener("click", () => call("open_tab", { url: null }));
        strip.appendChild(add);
      }

      // --- toolbar --------------------------------------------------------
      function render(state) {
        renderTabs(state.tabs);

        el("back").disabled = !state.canGoBack;
        el("forward").disabled = !state.canGoForward;

        loading = state.loading;
        el("progress").dataset.loading = String(state.loading);

        el("bookmark").dataset.on = String(state.bookmarked);
        el("bookmark").title = state.bookmarked
          ? "Remove bookmark"
          : "Bookmark this page";

        el("reload-icon").className = state.loading ? "ico ico-stop" : "ico ico-reload";
        el("reload").title = state.loading ? "Stop" : "Reload";
        el("reload").setAttribute("aria-label", state.loading ? "Stop" : "Reload");

        if (!editing) {
          urlInput.value = state.url || "";
          // A padlock only when the transport is actually encrypted. Showing one
          // for anything else would be a lie of exactly the kind padlocks exist
          // to prevent.
          const secure = (state.url || "").startsWith("https://");
          el("scheme-icon").className = secure
            ? "ico scheme ico-lock"
            : "ico scheme ico-search";
        }
      }

      // --- panel ----------------------------------------------------------
      let panelView = "history";

      /** Compact relative time: browsing history is read as "when", not "at". */
      function whenLabel(unixSeconds) {
        const secs = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
        if (secs < 60) return "just now";
        if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
        if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
        const days = Math.floor(secs / 86400);
        if (days < 30) return `${days}d ago`;
        return new Date(unixSeconds * 1000).toLocaleDateString();
      }

      function entryNode({ title, url, when, onOpen, onRemove }) {
        const row = document.createElement("div");
        row.className = "entry";
        row.addEventListener("click", onOpen);

        // Lazy: the panel renders up to 300 of these at once.
        row.appendChild(faviconNode(url, true));

        const text = document.createElement("div");
        text.className = "entry-text";
        const t = document.createElement("div");
        t.className = "entry-title";
        t.textContent = title || url;
        const u = document.createElement("div");
        u.className = "entry-url";
        u.textContent = url;
        text.append(t, u);
        row.appendChild(text);

        if (when) {
          const w = document.createElement("div");
          w.className = "entry-when";
          w.textContent = when;
          row.appendChild(w);
        }

        if (onRemove) {
          const rm = document.createElement("button");
          rm.className = "entry-remove";
          rm.title = "Remove";
          rm.setAttribute("aria-label", "Remove");
          rm.innerHTML =
            '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg>';
          rm.addEventListener("click", (e) => {
            e.stopPropagation(); // otherwise the row's open handler also fires
            onRemove();
          });
          row.appendChild(rm);
        }

        return row;
      }

      /* Guards against an older query painting over a newer one.
       *
       * renderPanel is async and several can be in flight at once, so a slow
       * request started earlier could resolve last and leave the list showing
       * results for a query the user has already typed past. Each run takes a
       * ticket and drops its results if another has started since. */
      let panelSeq = 0;

      async function renderPanel() {
        const seq = ++panelSeq;

        for (const btn of document.querySelectorAll(".seg-btn")) {
          btn.dataset.active = String(btn.dataset.view === panelView);
        }
        el("panel-search").placeholder =
          panelView === "history" ? "Search history" : "Search bookmarks";
        // Clearing everything only makes sense for history; bookmarks are
        // removed one at a time and deleting them all by accident would hurt.
        el("panel-clear").hidden = panelView !== "history";

        const list = el("panel-list");
        list.textContent = "";

        if (panelView === "settings") {
          // Search filters a list; settings is a form. Hiding the box is
          // clearer than leaving a control that silently does nothing.
          el("panel-search").hidden = true;
          await renderSettings(list, () => seq === panelSeq);
          return;
        }
        el("panel-search").hidden = false;

        const query = el("panel-search").value.trim();

        const open = (url) => {
          call("navigate", { input: url });
          closePanel();
        };

        if (panelView === "history") {
          const rows = (await call("history", { query: query || null, limit: 300 })) || [];
          if (seq !== panelSeq) return; // a newer render started; this is stale
          if (!rows.length) {
            list.innerHTML = `<div class="panel-empty">${
              query ? "Nothing in history matches that." : "No history yet."
            }</div>`;
            return;
          }
          for (const v of rows) {
            list.appendChild(
              entryNode({
                title: v.title,
                url: v.url,
                when: whenLabel(v.visited_at),
                onOpen: () => open(v.url),
              })
            );
          }
        } else {
          let rows = (await call("bookmarks")) || [];
          if (seq !== panelSeq) return; // a newer render started; this is stale
          if (query) {
            const q = query.toLowerCase();
            rows = rows.filter(
              (b) =>
                b.title.toLowerCase().includes(q) || b.url.toLowerCase().includes(q)
            );
          }
          if (!rows.length) {
            list.innerHTML = `<div class="panel-empty">${
              query ? "No bookmarks match that." : "No bookmarks yet."
            }</div>`;
            return;
          }
          // Newest first, matching how history reads.
          rows.sort((a, b) => b.added_at - a.added_at);
          for (const b of rows) {
            list.appendChild(
              entryNode({
                title: b.title,
                url: b.url,
                when: whenLabel(b.added_at),
                onOpen: () => open(b.url),
                onRemove: async () => {
                  await call("remove_bookmark", { id: b.id });
                  renderPanel();
                },
              })
            );
          }
        }
      }

      // --- settings -------------------------------------------------------
      function group(title) {
        const g = document.createElement("div");
        g.className = "group";
        const t = document.createElement("div");
        t.className = "group-title";
        t.textContent = title;
        g.appendChild(t);
        return g;
      }

      function row(name, help) {
        const r = document.createElement("div");
        r.className = "row";
        const label = document.createElement("div");
        label.className = "row-label";
        const n = document.createElement("div");
        n.className = "row-name";
        n.textContent = name;
        label.appendChild(n);
        if (help) {
          const h = document.createElement("div");
          h.className = "row-help";
          h.textContent = help;
          label.appendChild(h);
        }
        const control = document.createElement("div");
        control.className = "row-control";
        r.append(label, control);
        return { row: r, control };
      }

      /* `stillCurrent` reports whether this render is still the newest one.
       *
       * The three calls below are a round trip each, and the list is emptied
       * before them but appended to after. Two renders overlapping therefore
       * both cleared, then both appended, and the panel ended up with two
       * stacked copies of the settings form. Clicking a theme or engine button
       * triggers a re-render, so two quick clicks were enough to do it. */
      async function renderSettings(list, stillCurrent = () => true) {
        const [settings, engines, version] = await Promise.all([
          call("get_settings"),
          call("search_engines"),
          call("app_version"),
        ]);
        if (!settings || !engines) return;
        if (!stillCurrent()) return;

        const form = document.createElement("div");
        form.className = "settings";

        // --- general ---
        const general = group("General");
        const home = row(
          "Homepage",
          "Where new tabs open. Leave empty to follow the search engine."
        );
        const homeInput = document.createElement("input");
        homeInput.type = "text";
        homeInput.className = "text-input";
        homeInput.spellcheck = false;
        homeInput.value = settings.homepage || "";
        homeInput.placeholder = "Follow search engine";
        // Saved on blur rather than per keystroke: writing the file on every
        // character would be pointless churn, and Enter is not obviously a
        // "save" gesture in a form with no submit button.
        homeInput.addEventListener("blur", () =>
          call("set_homepage", { url: homeInput.value })
        );
        homeInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") homeInput.blur();
        });
        home.control.appendChild(homeInput);
        general.appendChild(home.row);

        const theme = row("Theme", "System follows Windows.");
        const themeSeg = document.createElement("div");
        themeSeg.className = "seg";
        for (const [value, label] of [
          ["system", "System"],
          ["light", "Light"],
          ["dark", "Dark"],
        ]) {
          const b = document.createElement("button");
          b.className = "seg-btn";
          b.textContent = label;
          b.dataset.active = String((settings.theme || "dark") === value);
          b.addEventListener("click", async () => {
            applyTheme(value);
            await call("set_theme", { theme: value });
            renderPanel();
          });
          themeSeg.appendChild(b);
        }
        theme.control.appendChild(themeSeg);
        general.appendChild(theme.row);

        form.appendChild(general);

        // --- search ---
        const search = group("Search engine");
        for (const engine of engines) {
          const btn = document.createElement("button");
          btn.className = "engine";
          btn.dataset.selected = String(engine.id === settings.search_engine);

          const check = document.createElement("span");
          check.className = "engine-check";
          const name = document.createElement("span");
          name.className = "engine-name";
          name.textContent = engine.name;
          const host = document.createElement("span");
          host.className = "engine-host";
          try {
            host.textContent = new URL(engine.home).host;
          } catch {
            host.textContent = "";
          }

          btn.append(check, name, host);
          btn.addEventListener("click", async () => {
            await call("set_search_engine", { id: engine.id });
            renderPanel();
          });
          search.appendChild(btn);
        }
        form.appendChild(search);

        // --- updates ---
        const updates = group("Updates");

        const ver = row("Version", `Brume ${version || "unknown"}`);
        updates.appendChild(ver.row);

        const auto = row(
          "Check for updates on launch",
          "Brume asks before installing. Updates are never applied silently."
        );
        const toggle = document.createElement("button");
        toggle.className = "switch";
        toggle.setAttribute("role", "switch");
        toggle.setAttribute("aria-checked", String(settings.auto_update));
        toggle.setAttribute("aria-label", "Check for updates on launch");
        toggle.addEventListener("click", async () => {
          const next = toggle.getAttribute("aria-checked") !== "true";
          await call("set_auto_update", { enabled: next });
          toggle.setAttribute("aria-checked", String(next));
        });
        auto.control.appendChild(toggle);
        updates.appendChild(auto.row);

        const manual = row(
          "Check now",
          "Always available, whatever the setting above is."
        );
        const status = document.createElement("span");
        status.className = "status";
        const check = document.createElement("button");
        check.className = "action";
        check.textContent = "Check for updates";
        check.addEventListener("click", async () => {
          check.disabled = true;
          status.textContent = "Checking...";
          try {
            // The command shows its own dialog for every outcome; this only
            // clears the inline status so the button does not look stuck.
            await invoke("check_for_updates");
            status.textContent = "";
          } catch (err) {
            console.error("[brume] update check failed:", err);
            status.textContent = "";
          } finally {
            check.disabled = false;
          }
        });
        manual.control.append(status, check);
        updates.appendChild(manual.row);

        form.appendChild(updates);
        list.appendChild(form);
      }

      async function openPanel(view) {
        panelView = view;
        el("panel").hidden = false;
        el("panel-search").value = "";
        await call("set_panel", { open: true });
        renderPanel();
      }

      async function closePanel() {
        el("panel").hidden = true;
        await call("set_panel", { open: false });
      }

      el("show-history").addEventListener("click", () => openPanel("history"));
      el("show-settings").addEventListener("click", () => openPanel("settings"));
      el("panel-close").addEventListener("click", closePanel);
      /* Debounced rather than wired straight to `input`.
       *
       * Searching history is not a cheap local filter: the store keeps history
       * as append-only JSONL and has no index, so every query reads the whole
       * file and parses every line, up to the 20,000-entry cap. Firing that per
       * keystroke meant typing a six-letter word re-read and re-parsed the file
       * six times. Bookmarks are filtered in-page and would not need this, but
       * one path for both keeps the two views behaving the same. */
      let searchTimer = null;
      el("panel-search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderPanel, 120);
      });
      for (const btn of document.querySelectorAll(".seg-btn")) {
        btn.addEventListener("click", () => {
          panelView = btn.dataset.view;
          el("panel-search").value = "";
          renderPanel();
        });
      }
      el("panel-clear").addEventListener("click", async () => {
        await call("clear_history");
        renderPanel();
      });

      el("bookmark").addEventListener("click", async () => {
        await call("toggle_bookmark_active");
        // The star's state comes back through brume://state, so nothing is set
        // here - the backend stays the single source of truth.
      });

      /**
       * Applies a theme to the chrome.
       *
       * Set as an attribute rather than by swapping a stylesheet, so the CSS
       * variables cascade and every component follows without knowing about it.
       */
      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme || "dark";
      }

      // --- events ---------------------------------------------------------
      listen("brume://state", (event) => render(event.payload));

      // Keyboard shortcuts arrive as events from the Rust side, because a
      // keydown listener here never fires while a page has focus: the keystroke
      // goes to the content webview, which holds no capabilities.
      //
      // They are global shortcuts registered on window focus, NOT a native
      // accelerator table. That was tried and does not work in this stack,
      // because nothing calls TranslateAcceleratorW. See shortcuts.rs, which
      // says so at length and which this comment used to contradict.
      listen("brume://focus-address", () => {
        urlInput.focus();
        urlInput.select();
      });

      listen("brume://open-panel", (event) => {
        const view = event.payload === "settings" ? "settings" : "history";
        // Pressing the same shortcut again closes it, which is what a toggle
        // shortcut is expected to do.
        if (!el("panel").hidden && panelView === view) {
          closePanel();
        } else {
          openPanel(view);
        }
      });

      el("back").addEventListener("click", () => call("go_back"));
      el("forward").addEventListener("click", () => call("go_forward"));
      el("reload").addEventListener("click", () =>
        call(loading ? "stop_loading" : "reload")
      );

      urlInput.addEventListener("focus", () => {
        editing = true;
        urlInput.select(); // typing replaces rather than appends
      });

      urlInput.addEventListener("blur", () => {
        editing = false;
        // Put back whatever is actually loaded, discarding an abandoned edit.
        call("browser_state").then((s) => s && render(s));
      });

      urlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          editing = false;
          urlInput.blur();
          call("navigate", { input: urlInput.value });
        } else if (event.key === "Escape") {
          event.preventDefault();
          editing = false;
          urlInput.blur();
        }
      });

      // --- boot -----------------------------------------------------------
      // Theme first, so the chrome never paints in the wrong palette and then
      // corrects itself a frame later.
      call("get_settings").then((s) => s && applyTheme(s.theme));
      call("browser_state").then((s) => s && render(s));
    </script>
  </body>
</html>
