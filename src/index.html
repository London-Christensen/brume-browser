<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brume</title>

    <!--
      This document is the browser chrome, not a page. It occupies a strip at the
      top of the window - 36px of tab strip over 40px of toolbar, plus the
      bookmarks bar and the find bar when either is open - and the page the user
      is looking at is a separate sibling webview underneath, one per tab. See
      src-tauri/src/browser.rs.

      The heights here and the constants in browser.rs must agree.
    -->
    <link rel="stylesheet" href="assets/brand/css/tokens.css" />

    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/brand/fonts/archivo-latin-var.woff2") format("woff2-variations");
        font-weight: 300 700;
        font-display: block;
      }

      /* Dark is the default rather than `system`, because Brume's chrome is
         drawn around Ink and the brand is dark-first. Every surface colour is a
         variable so the light theme is a value swap, not a second stylesheet. */
      :root {
        color-scheme: dark;
        --bg: var(--brume-ink);
        --fg: var(--brume-paper);
        --fg-muted: var(--brume-haar-dark);
        --hairline: #232a30;
        --surface: #171d24;
        --surface-hover: #1e252d;
        --elev-1: #212a33; /* hover on a flat control */
        --elev-2: #2b333c; /* pressed, or hover on an already-raised control */
        --input-bg: #0e1319;
        --border-strong: #2d363f;
        --switch-track: #2a323a;
        --switch-knob: #7d8b95;

        --tab-strip-h: 36px;
        --toolbar-h: 40px;
        --bookmarks-bar-h: 32px;
      }

      :root[data-theme="light"],
      :root[data-theme="system"] {
        color-scheme: light;
        --bg: var(--brume-paper);
        --fg: var(--brume-ink);
        --fg-muted: var(--brume-haar);
        --hairline: #dee1e4;
        --surface: #ffffff;
        --surface-hover: #eaecee;
        --elev-1: #e4e7e9;
        --elev-2: #d6dade;
        --input-bg: #ffffff;
        --border-strong: #c3c9ce;
        --switch-track: #c3c9ce;
        --switch-knob: #ffffff;
      }

      /* `system` follows the OS, so it has to fall back to the dark values when
         the OS is dark - the light block above claims it unconditionally. */
      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          color-scheme: dark;
          --bg: var(--brume-ink);
          --fg: var(--brume-paper);
          --fg-muted: var(--brume-haar-dark);
          --hairline: #232a30;
          --surface: #171d24;
          --surface-hover: #1e252d;
          --elev-1: #212a33;
          --elev-2: #2b333c;
          --input-bg: #0e1319;
          --border-strong: #2d363f;
          --switch-track: #2a323a;
          --switch-knob: #7d8b95;
        }
      }

      * {
        box-sizing: border-box;
      }

      /* Must outrank the components' own display rules.
         `[hidden]` is only a UA default of `display: none`, so any element given
         an explicit display - `.btn` is `display: grid` - ignores it completely
         and stays on screen while reporting `hidden === true`. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden; /* the strip is a fixed height; nothing may scroll it */
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: var(--text-ui);
        line-height: var(--lh-ui);
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      /* --- tab strip ----------------------------------------------------- */
      /* Two parts, and the split is the whole point: the tabs scroll, the new
         tab button does not. Measured before the split, at 1920px with 50 tabs:
         tabs bottomed out at their 44px floor, eight of them were clipped off
         the right edge with no way to reach them, and the new tab button sat at
         x=2259 against a strip ending at 1920. On a 1200px window that starts
         at about 26 tabs, which is ordinary use. */
      /* Tabs down the side.
       *
       * Done by repositioning the strip that already exists rather than by
       * building a second one, so a tab is drawn by one piece of code in either
       * layout and the two cannot drift apart.
       *
       * The chrome webview fills the window in this mode and the page is placed
       * on top of the middle by relayout, so what shows here is the L around
       * it: this column, and the toolbar band to the right of it. Everything
       * else shifts right by the same amount the page does.
       *
       * --sidebar-w must match SIDEBAR_WIDTH in browser.rs.
       */
      body[data-sidebar="true"] {
        --sidebar-w: 208px;
        padding-left: var(--sidebar-w);
      }
      body[data-sidebar="true"] .tabs {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--sidebar-w);
        flex-direction: column;
        align-items: stretch;
        padding: 6px;
        gap: 2px;
        border-right: 1px solid var(--hairline);
        background: var(--bg);
      }
      body[data-sidebar="true"] .tab-scroll {
        flex: 1 1 auto;
        flex-direction: column;
        align-items: stretch;
        gap: 1px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      /* Full width and a fixed height, so a vertical tab shows a title instead
         of the three characters a horizontal one is down to at twenty tabs. */
      body[data-sidebar="true"] .tab {
        max-width: none;
        width: 100%;
        height: 30px;
        flex: 0 0 30px;
      }
      /* The active marker moves to the leading edge: an underline on a stacked
         row reads as a separator between two tabs rather than as a state. */
      body[data-sidebar="true"] .tab[data-split="true"] {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      body[data-sidebar="true"] .new-tab {
        width: 100%;
        margin-top: 4px;
      }
      /* A pinned tab keeps its place at the top rather than shrinking to an
         icon: there is room for the title here, which is the point. */
      body[data-sidebar="true"] .tab[data-pinned="true"] {
        max-width: none;
        width: 100%;
      }

      .tabs {
        flex: 0 0 var(--tab-strip-h);
        display: flex;
        align-items: stretch;
        padding: 5px 6px 0;
        min-width: 0;
        overflow: hidden;
      }

      .tab-scroll {
        flex: 1 1 auto;
        display: flex;
        align-items: stretch;
        gap: 1px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        /* No visible scrollbar. The strip is 36px tall and a scrollbar would
           eat a third of it; the wheel and the arrow keys reach everything. */
        scrollbar-width: none;
      }
      .tab-scroll::-webkit-scrollbar {
        display: none;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1 1 0;
        /* Tabs shrink as more open, but never past the point where the title is
           gone entirely - beyond that they stop shrinking and simply clip. */
        min-width: 44px;
        max-width: 220px;
        padding: 0 8px 0 10px;
        border-radius: var(--radius) var(--radius) 0 0;
        background: transparent;
        color: var(--fg-muted);
        border: 0;
        font: inherit;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .tab:hover {
        background: var(--elev-1);
        color: var(--fg);
      }
      .tab[data-active="true"] {
        background: var(--surface);
        color: var(--fg);
      }
      /* The split partner. It is on screen, so it reads like the active tab
         rather than like a background one, but the underline says which of the
         two it is without a second colour to learn. */
      .tab[data-split="true"] {
        background: var(--surface);
        color: var(--fg);
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      .tab-favicon {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        border-radius: 2px;
        object-fit: contain;
      }
      /* Shown when a site has no favicon, or it fails to load. */
      .tab-favicon-fallback {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0.45;
        -webkit-mask: url("assets/brand/icons/tab.svg") no-repeat center / contain;
        mask: url("assets/brand/icons/tab.svg") no-repeat center / contain;
      }

      /* Private tabs read as a distinct kind of tab, not just a tab with a
         different icon. Slightly lifted so the difference survives a glance. */
      .tab[data-private="true"] {
        background: var(--elev-1);
      }
      .tab[data-private="true"][data-active="true"] {
        background: var(--elev-2);
      }
      .tab-private {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0.75;
        -webkit-mask: url("assets/brand/icons/private.svg") no-repeat center / contain;
        mask: url("assets/brand/icons/private.svg") no-repeat center / contain;
      }

      .tab-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: left;
        font-size: 12px;
      }

      .tab-close {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 17px;
        height: 17px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: inherit;
        cursor: default;
        opacity: 0;
        transition: opacity 110ms ease, background 110ms ease;
      }
      /* The close button appears on hover or on the active tab. Always-visible
         close buttons on every tab turn the strip into a row of targets to
         misclick. */
      .tab:hover .tab-close,
      .tab[data-active="true"] .tab-close {
        opacity: 0.7;
      }
      .tab-close:hover {
        opacity: 1;
        background: var(--elev-2);
      }
      .tab-close svg {
        width: 9px;
        height: 9px;
      }

      .new-tab {
        flex: 0 0 auto;
        align-self: center;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-left: 3px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-muted);
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .new-tab:hover {
        background: var(--surface-hover);
        color: var(--fg);
      }

      /* Wider than an icon button, because it holds text. Tabular figures so
         stepping 90/100/110 does not shift the toolbar around it. */
      .zoom-btn {
        width: auto;
        min-width: 42px;
        padding: 0 7px;
        font-family: var(--font-ui);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--fg-muted);
      }
      .zoom-btn:hover {
        color: var(--fg);
      }

      /* --- tab context menu ---------------------------------------------- */
      /* Fixed, because the chrome webview is its own document: the menu cannot
         escape it, and it does not need to. Its height is well inside the
         76px strip only because the menu opens downward over the toolbar. */
      .ctxmenu {
        position: fixed;
        z-index: 50;
        min-width: 168px;
        padding: 4px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      }

      .ctxmenu button {
        display: block;
        width: 100%;
        /* Capped and truncated for the overflow menu, whose labels are page
           titles. The tab menu's own labels are short fixed strings and never
           reach this. */
        max-width: 320px;
        overflow: hidden;
        padding: 6px 10px;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12px;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: left;
        cursor: default;
      }
      .ctxmenu button:hover:not(:disabled) {
        background: var(--elev-1);
      }
      .ctxmenu button:disabled {
        color: var(--fg-muted);
        opacity: 0.5;
      }
      .ctxmenu hr {
        margin: 4px 6px;
        border: 0;
        border-top: 1px solid var(--hairline);
      }
      /* A folder inside a menu. The chevron says the click goes somewhere
         rather than doing something, which is the one thing separating it from
         every other row. */
      .ctxmenu button.has-sub::after {
        content: "›";
        float: right;
        margin-left: 12px;
        color: var(--fg-muted);
      }

      /* The audio indicator doubles as the mute control, which is why it is a
         button rather than a decoration. Sits before the close button so the
         close button stays where it always is. */
      .tab-audio {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: currentColor;
        color: var(--fg-muted);
        cursor: default;
        -webkit-mask: url("assets/brand/icons/tab-audio.svg") no-repeat center / 14px;
        mask: url("assets/brand/icons/tab-audio.svg") no-repeat center / 14px;
      }
      .tab-audio:hover {
        color: var(--fg);
      }
      /* Muted is the state worth calling out, so it gets the struck-through
         speaker and drops to the dimmest colour: silenced, still there. */
      .tab-audio[data-muted="true"] {
        opacity: 0.55;
        -webkit-mask-image: url("assets/brand/icons/tab-audio-muted.svg");
        mask-image: url("assets/brand/icons/tab-audio-muted.svg");
      }

      /* A pinned tab is icon-only: no title, no close button, and narrow enough
         that several fit without crowding the rest of the strip. */
      .tab[data-pinned="true"] {
        flex: 0 0 auto;
        min-width: 0;
        width: 34px;
        padding: 0 10px;
      }
      .tab[data-pinned="true"] .tab-title,
      .tab[data-pinned="true"] .tab-close {
        display: none;
      }

      /* --- find bar ------------------------------------------------------ */
      /* Height is pinned to 36px because browser.rs adds exactly that to the
         chrome when the bar opens. The two must agree or the page is left
         overlapped by the difference. Same contract the tab strip and toolbar
         already have with TAB_STRIP_HEIGHT and TOOLBAR_HEIGHT. */
      .findbar {
        flex: 0 0 36px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 8px;
        background: var(--surface);
        border-top: 1px solid var(--hairline);
        min-height: 0;
      }

      #find-input {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }

      /* Tabular figures so "9 of 10" does not shift width as the count ticks. */
      .find-count {
        flex: 0 0 auto;
        padding: 0 8px;
        font-family: var(--font-ui);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--fg-muted);
        white-space: nowrap;
      }

      .find-count[data-none="true"] {
        color: var(--fg);
      }

      /* The two search modifiers. Lamplight when on, which is the same "this is
         active" signal the bookmark star already uses. */
      .find-opt {
        width: auto;
        min-width: 26px;
        padding: 0 6px;
        font-family: var(--font-ui);
        font-size: 11.5px;
        color: var(--fg-muted);
      }
      .find-opt[data-on="true"] {
        background: var(--elev-2);
        color: var(--brume-lamplight);
      }
      /* Whole word gets an underline, so the two are distinguishable at a
         glance rather than by reading two letters of nearly identical text. */
      #find-word {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* --- bookmarks bar -------------------------------------------------- */
      /* The same contract as the find bar, at 32px: browser.rs adds exactly
         BOOKMARKS_BAR_HEIGHT to the chrome while this is showing, and if the two
         disagree the page is left overlapped by the difference.

         `overflow: hidden` is a backstop, not the mechanism. Items that do not
         fit are moved into the overflow menu by measurement in JS, because a row
         silently clipping the last bookmark mid-word looks like a rendering bug
         and gives no way to reach it. */
      .bookmarks {
        flex: 0 0 var(--bookmarks-bar-h);
        display: flex;
        align-items: center;
        gap: 1px;
        padding: 0 6px;
        background: var(--surface);
        border-top: 1px solid var(--hairline);
        min-height: 0;
        overflow: hidden;
      }

      .bm {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 7px;
        /* Capped so one bookmark with a long title cannot take the whole bar.
           Short titles still size to their content. */
        max-width: 172px;
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
        cursor: default;
        transition: background 110ms ease;
      }
      .bm:hover {
        background: var(--elev-1);
      }
      .bm:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .bm-title {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* A folder on the bar. Its chevron is what says the click opens a menu
         instead of a page, so it sits after the title where it reads as part of
         the control rather than as an icon for it. */
      .bm-folder {
        font-weight: 500;
      }
      .bm-folder .ico {
        flex: 0 0 12px;
        width: 12px;
        height: 12px;
        color: var(--fg-muted);
      }

      /* Pushed to the right edge, where it stays put as the row fills up. */
      .bm-more {
        margin-left: auto;
      }

      .bm-empty {
        padding: 0 8px;
        color: var(--fg-muted);
        font-size: 11.5px;
      }

      /* --- toolbar ------------------------------------------------------- */
      .toolbar {
        flex: 0 0 var(--toolbar-h);
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 8px;
        background: var(--surface);
        min-height: 0;
      }

      .btn {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        cursor: default;
        transition: background 110ms ease, opacity 110ms ease;
      }
      .btn:hover:not(:disabled) {
        background: var(--elev-1);
      }
      .btn:disabled {
        /* Dimmed rather than hidden: a button that disappears makes the toolbar
           shift under the pointer, which is worse than one visibly unavailable. */
        opacity: 0.28;
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* Icons are painted as masks so they inherit currentColor and survive the
         disabled state's opacity cleanly. */
      .ico {
        width: 15px;
        height: 15px;
        background: currentColor;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
      }
      .ico-back { -webkit-mask-image: url("assets/brand/icons/back.svg"); mask-image: url("assets/brand/icons/back.svg"); }
      .ico-forward { -webkit-mask-image: url("assets/brand/icons/forward.svg"); mask-image: url("assets/brand/icons/forward.svg"); }
      .ico-reload { -webkit-mask-image: url("assets/brand/icons/reload.svg"); mask-image: url("assets/brand/icons/reload.svg"); }
      .ico-stop { -webkit-mask-image: url("assets/brand/icons/close.svg"); mask-image: url("assets/brand/icons/close.svg"); }
      .ico-home { -webkit-mask-image: url("assets/brand/icons/home.svg"); mask-image: url("assets/brand/icons/home.svg"); }
      .ico-download { -webkit-mask-image: url("assets/brand/icons/download.svg"); mask-image: url("assets/brand/icons/download.svg"); }
      .ico-warning { -webkit-mask-image: url("assets/brand/icons/warning.svg"); mask-image: url("assets/brand/icons/warning.svg"); }
      .ico-external { -webkit-mask-image: url("assets/brand/icons/external.svg"); mask-image: url("assets/brand/icons/external.svg"); }
      .ico-lock { -webkit-mask-image: url("assets/brand/icons/lock.svg"); mask-image: url("assets/brand/icons/lock.svg"); }
      .ico-search { -webkit-mask-image: url("assets/brand/icons/search.svg"); mask-image: url("assets/brand/icons/search.svg"); }
      .ico-plus { -webkit-mask-image: url("assets/brand/icons/plus.svg"); mask-image: url("assets/brand/icons/plus.svg"); }
      .ico-bookmark { -webkit-mask-image: url("assets/brand/icons/bookmark.svg"); mask-image: url("assets/brand/icons/bookmark.svg"); }
      .ico-history { -webkit-mask-image: url("assets/brand/icons/history.svg"); mask-image: url("assets/brand/icons/history.svg"); }
      .ico-trash { -webkit-mask-image: url("assets/brand/icons/trash.svg"); mask-image: url("assets/brand/icons/trash.svg"); }
      .ico-settings { -webkit-mask-image: url("assets/brand/icons/settings.svg"); mask-image: url("assets/brand/icons/settings.svg"); }
      .ico-check { -webkit-mask-image: url("assets/brand/icons/check.svg"); mask-image: url("assets/brand/icons/check.svg"); }
      .ico-chevron-right { -webkit-mask-image: url("assets/brand/icons/chevron-right.svg"); mask-image: url("assets/brand/icons/chevron-right.svg"); }
      .ico-chevron-down { -webkit-mask-image: url("assets/brand/icons/chevron-down.svg"); mask-image: url("assets/brand/icons/chevron-down.svg"); }
      .ico-reader { -webkit-mask-image: url("assets/brand/icons/reader.svg"); mask-image: url("assets/brand/icons/reader.svg"); }
      .ico-upload { -webkit-mask-image: url("assets/brand/icons/upload.svg"); mask-image: url("assets/brand/icons/upload.svg"); }
      /* Used by the rename button since 0.5.0 and never defined, so it painted
         a solid square: `.ico` fills with currentColor and relies on the mask
         to cut the shape out, and no mask means nothing is cut. */
      .ico-edit { -webkit-mask-image: url("assets/brand/icons/edit.svg"); mask-image: url("assets/brand/icons/edit.svg"); }

      /* The star fills in when the page is bookmarked. Lamplight is the accent
         the brand allows once per screen, and this is where it earns it: a
         single, deliberate signal that this page is saved. */
      .btn[data-on="true"] {
        color: var(--brume-lamplight);
      }
      /* Reader mode found nothing to show. Dimmed briefly rather than raising a
         dialog: it is information, not a decision, and the button's own tooltip
         carries the words. */
      .btn[data-failed="true"] {
        opacity: 0.45;
      }

      /* --- address bar --------------------------------------------------- */
      .address {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        margin: 0 6px;
        padding: 0 11px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--input-bg);
        min-width: 0;
        transition: border-color 110ms ease;
      }
      .address:hover {
        border-color: var(--border-strong);
      }
      .address:focus-within {
        border-color: transparent;
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .scheme {
        flex: 0 0 auto;
        width: 12px;
        height: 12px;
        color: var(--fg-muted);
      }

      #url {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #url:focus {
        outline: none;
      }
      #url::placeholder {
        color: var(--fg-muted);
        opacity: 0.7;
      }

      /* --- panel --------------------------------------------------------- */
      .panel {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
      }

      .panel-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--hairline);
      }

      .seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius);
        background: var(--surface);
      }
      .seg-btn {
        padding: 5px 13px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .seg-btn:hover {
        color: var(--fg);
      }
      .seg-btn[data-active="true"] {
        background: var(--elev-2);
        color: var(--fg);
      }

      #panel-search {
        flex: 1 1 auto;
        min-width: 0;
        height: 28px;
        padding: 0 11px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--input-bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #panel-search:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }

      .panel-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 6px 8px 16px;
        min-height: 0;
      }

      .entry {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 8px 10px;
        border-radius: var(--radius);
        cursor: default;
      }
      .entry:hover {
        background: var(--surface);
      }

      .entry-text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .entry-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .entry-url {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-size: 11.5px;
        font-family: var(--font-mono);
      }
      .entry-when {
        flex: 0 0 auto;
        color: var(--fg-muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      /* A day heading in history. Sticky so the day stays readable while
         scrolling through a long one. */
      .panel-day {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 10px 4px;
        background: var(--bg);
        color: var(--fg-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      /* A folder row in the manager. Its title carries the weight, because the
         tree is read by scanning folder names down the left edge. */
      .entry-folder .entry-title {
        font-weight: 600;
      }
      .entry-folder-mark {
        flex: 0 0 16px;
        width: 16px;
        height: 16px;
        color: var(--fg-muted);
      }
      /* The title turned into a field, sized to sit exactly where the text was
         so the row does not jump when editing starts. */
      .entry-rename {
        width: 100%;
        padding: 1px 4px;
        border: 1px solid var(--accent);
        border-radius: 2px;
        background: var(--input-bg);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 13px;
        user-select: text;
        -webkit-user-select: text;
      }
      .entry-rename:focus {
        outline: none;
      }

      .entry-remove {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg-muted);
        cursor: default;
        opacity: 0;
      }
      .entry:hover .entry-remove {
        opacity: 1;
      }
      .entry-remove:hover {
        background: var(--elev-2);
        color: var(--fg);
      }

      /* --- settings form -------------------------------------------------- */
      .settings {
        max-width: 620px;
        padding: 8px 4px 40px;
      }

      .group + .group {
        margin-top: 30px;
      }

      .group-title {
        margin-bottom: 12px;
        color: var(--fg-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 11px 10px;
        border-radius: var(--radius);
      }
      .row + .row {
        border-top: 1px solid var(--hairline);
      }
      .row-label {
        flex: 1 1 auto;
        min-width: 0;
      }
      .row-name {
        font-size: 13px;
      }
      .row-help {
        margin-top: 3px;
        color: var(--fg-muted);
        font-size: 11.5px;
        line-height: 16px;
      }
      .row-control {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .text-input {
        width: 290px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--input-bg);
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 11.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      .text-input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }

      .action {
        height: 28px;
        padding: 0 13px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
        transition: background 110ms ease;
      }
      .action:hover {
        background: var(--elev-1);
      }
      .action:disabled {
        opacity: 0.5;
      }

      /* Same switch as the installer shell, so the two surfaces of Brume that
         ask this question look like the same product. */
      .switch {
        position: relative;
        width: 36px;
        height: 21px;
        padding: 0;
        border: 0;
        border-radius: 11px;
        background: var(--switch-track);
        cursor: default;
        transition: background 160ms ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--switch-knob);
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.3, 1), background 160ms ease;
      }
      .switch[aria-checked="true"] {
        background: var(--brume-haar-dark);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(15px);
        background: var(--brume-ink);
      }
      .switch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Adding an engine: a name, a URL and a button on one row. The URL takes
         the space because it is the long one and the one worth reading back. */
      .engine-add {
        display: flex;
        gap: 6px;
        padding: 8px 10px 2px;
      }
      .engine-add input {
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--elev-1);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
      }
      .engine-add input:first-child {
        flex: 0 0 108px;
      }
      .engine-add input:nth-child(2) {
        flex: 1 1 auto;
      }
      .engine-add input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .engine-error:not(:empty) {
        padding: 4px 10px 8px;
        color: var(--danger, #e5484d);
        font-size: 11.5px;
      }
      /* Only on a user-defined engine, and only worth reading on hover: the
         row's job is choosing, not managing. */
      .engine-remove {
        flex: 0 0 auto;
        color: var(--fg-muted);
        font-size: 11px;
        opacity: 0;
        transition: opacity 110ms ease;
      }
      .engine:hover .engine-remove,
      .engine:focus-within .engine-remove {
        opacity: 1;
      }
      .engine-remove:hover {
        color: var(--fg);
        text-decoration: underline;
      }

      .engine {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        text-align: left;
        cursor: default;
        transition: background 110ms ease, color 110ms ease;
      }
      .engine:hover {
        background: var(--surface);
        color: var(--fg);
      }
      .engine[data-selected="true"] {
        color: var(--fg);
      }
      .engine-check {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0;
        -webkit-mask: url("assets/brand/icons/check.svg") no-repeat center / contain;
        mask: url("assets/brand/icons/check.svg") no-repeat center / contain;
      }
      .engine[data-selected="true"] .engine-check {
        opacity: 1;
      }
      .engine-name {
        flex: 0 0 auto;
        font-size: 13px;
      }
      .engine-host {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-family: var(--font-mono);
        font-size: 11px;
        text-align: right;
      }

      .status {
        color: var(--fg-muted);
        font-size: 11.5px;
      }

      .panel-empty {
        padding: 40px 12px;
        text-align: center;
        color: var(--fg-muted);
        font-size: 13px;
      }

      /* --- address bar suggestions ---------------------------------------- */
      /* Absolutely positioned rather than a flex row, because this is an
         overlay: the Rust side grows the chrome webview and raises it above the
         page, so the dropdown covers the top of the page instead of pushing it
         down. Taking part in the flex column would move the bookmarks bar every
         time someone typed a character. See src-tauri/src/overlay.rs. */
      .suggest {
        position: absolute;
        top: calc(var(--tab-strip-h) + var(--toolbar-h));
        z-index: 40;
        padding: 4px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
        overflow: hidden;
      }

      .sug {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 32px;
        padding: 0 9px;
        border-radius: 3px;
        cursor: default;
      }
      /* Keyboard selection and hover are the same state deliberately: two
         different highlights in one list is a way to lose track of which one
         Enter will take. */
      .sug[data-on="true"],
      .sug:hover {
        background: var(--elev-1);
      }

      .sug-icon {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        background: currentColor;
        opacity: 0.5;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
      }
      .sug[data-kind="bookmark"] .sug-icon {
        -webkit-mask-image: url("assets/brand/icons/bookmark.svg");
        mask-image: url("assets/brand/icons/bookmark.svg");
        opacity: 1;
        color: var(--brume-lamplight);
      }
      .sug[data-kind="history"] .sug-icon {
        -webkit-mask-image: url("assets/brand/icons/history.svg");
        mask-image: url("assets/brand/icons/history.svg");
      }
      .sug[data-kind="search"] .sug-icon {
        -webkit-mask-image: url("assets/brand/icons/search.svg");
        mask-image: url("assets/brand/icons/search.svg");
      }

      .sug-title {
        flex: 0 1 auto;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
      }
      .sug-url {
        flex: 1 1 auto;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-family: var(--font-mono);
        font-size: 11.5px;
      }

      /* --- tab search ------------------------------------------------------ */
      /* Same overlay as the address dropdown and the permission prompt, so the
         page is covered rather than moved. Centred rather than anchored: it is
         about the whole window's worth of tabs, not about one control. */
      .tabsearch {
        position: absolute;
        top: calc(var(--tab-strip-h) + var(--toolbar-h));
        left: 50%;
        transform: translateX(-50%);
        z-index: 46;
        width: 460px;
        max-width: calc(100% - 24px);
        padding: 4px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
      }

      #tabsearch-input {
        width: 100%;
        height: 30px;
        padding: 0 9px;
        border: 0;
        border-bottom: 1px solid var(--hairline);
        background: transparent;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 12.5px;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #tabsearch-input:focus {
        outline: none;
      }

      .tabsearch-list {
        margin-top: 4px;
      }
      .ts-row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 30px;
        padding: 0 9px;
        border-radius: 3px;
        cursor: default;
      }
      .ts-row[data-on="true"],
      .ts-row:hover {
        background: var(--elev-1);
      }
      .ts-title {
        flex: 0 1 auto;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
      }
      .ts-url {
        flex: 1 1 auto;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg-muted);
        font-family: var(--font-mono);
        font-size: 11px;
      }
      /* Marks the tab you are already on, so switching to it is not offered as
         though it would change anything. */
      .ts-current {
        flex: 0 0 auto;
        color: var(--fg-muted);
        font-size: 11px;
      }
      .tabsearch-empty {
        padding: 9px;
        color: var(--fg-muted);
        font-size: 12px;
      }

      /* The padlock is a control now, so it has to look like one. */
      .scheme {
        cursor: default;
        border-radius: 2px;
        transition: opacity 110ms ease;
      }
      .scheme:hover {
        opacity: 0.7;
      }

      /* --- site info popover ----------------------------------------------- */
      /* Hangs off the padlock, which is the only part of the chrome that already
         means "about this site". Same overlay mechanism as everything else here,
         so the page is covered rather than moved. */
      .siteinfo {
        position: absolute;
        top: calc(var(--tab-strip-h) + var(--toolbar-h));
        z-index: 44;
        width: 340px;
        max-width: calc(100% - 24px);
        padding: 13px 14px 11px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
      }

      .si-origin {
        font-family: var(--font-mono);
        font-size: 12px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .si-secure {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 7px;
        font-size: 12.5px;
      }
      .si-secure[data-secure="true"] {
        color: var(--fg);
      }
      /* Not alarming, just honest. An http page is not an attack, it is simply
         not private, and colouring it like a warning would cry wolf. */
      .si-secure[data-secure="false"] {
        color: var(--brume-lamplight);
      }
      .si-heading {
        margin: 12px 0 4px;
        padding-top: 10px;
        border-top: 1px solid var(--hairline);
        color: var(--fg-muted);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .si-perm {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        font-size: 12px;
      }
      .si-perm-kind {
        flex: 1 1 auto;
      }
      .si-perm-state[data-state="allow"] {
        color: var(--brume-lamplight);
      }
      .si-perm-state[data-state="block"] {
        color: var(--fg-muted);
      }
      .si-none {
        padding: 2px 0 4px;
        color: var(--fg-muted);
        font-size: 11.5px;
        line-height: 16px;
      }

      /* --- permission prompt ---------------------------------------------- */
      /* Same overlay mechanism as the suggestions dropdown: the chrome grows and
         is raised above the page, so the prompt covers the top of the page
         rather than pushing it down. Anchored to the left of the address bar,
         where the padlock is, because that is the part of the chrome that
         already means "about this site". */
      .permission {
        position: absolute;
        top: calc(var(--tab-strip-h) + var(--toolbar-h));
        z-index: 45;
        width: 380px;
        max-width: calc(100% - 24px);
        padding: 14px 15px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
      }

      .perm-origin {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg);
      }
      .perm-ask {
        margin-top: 5px;
        font-size: 13px;
        line-height: 18px;
        color: var(--fg);
      }
      /* Shown only when the page asked without anyone clicking anything. A site
         reaching for the camera unprompted is worth saying out loud. */
      .perm-note {
        margin-top: 7px;
        font-size: 11.5px;
        line-height: 16px;
        color: var(--fg-muted);
      }
      .perm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 13px;
      }
      .perm-btn {
        padding: 6px 13px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12.5px;
        cursor: default;
      }
      .perm-btn:hover {
        background: var(--elev-1);
      }
      /* Block is the wider default: it is the safer of the two, and it is what
         dismissing the prompt does anyway. */
      .perm-btn[data-kind="block"] {
        border-color: var(--border-strong);
      }
      .perm-btn[data-kind="allow"] {
        border-color: var(--brume-lamplight);
        color: var(--brume-lamplight);
      }

      /* Site permission rows in Settings. */
      .perm-list {
        margin: 2px 0 6px;
      }
      .perm-line {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: var(--radius);
        font-size: 12px;
      }
      .perm-line:hover {
        background: var(--surface);
      }
      .perm-line-origin {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-family: var(--font-mono);
        font-size: 11.5px;
      }
      .perm-line-kind {
        flex: 0 0 auto;
        color: var(--fg-muted);
      }
      .perm-line-state {
        flex: 0 0 auto;
        min-width: 58px;
        text-align: right;
      }
      .perm-line-state[data-state="allow"] {
        color: var(--brume-lamplight);
      }
      .perm-line-state[data-state="block"] {
        color: var(--fg-muted);
      }

      /* --- download progress --------------------------------------------- */
      /* A 3px rule under the filename. Enough to read at a glance without
         turning a list row into a widget. */
      .dl-bar {
        position: relative;
        height: 3px;
        margin-top: 7px;
        border-radius: 2px;
        background: var(--elev-1);
        overflow: hidden;
      }

      .dl-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--brume-haar-dark);
        /* Linear, not eased: the bar is reporting a measurement that arrives
           every 200ms, and an ease makes it look like it is deciding. */
        transition: width 180ms linear;
      }

      /* No Content-Length, so there is no fraction to draw. Borrows the sweep
         the page-load indicator uses, which already reads as "working, length
         unknown" rather than as a stalled bar sitting at zero. */
      .dl-bar[data-indeterminate="true"] .dl-fill {
        width: 32%;
        animation: sweep 1.05s ease-in-out infinite;
      }

      /* --- loading indicator --------------------------------------------- */
      /* A 2px rule along the bottom edge of the toolbar. Indeterminate, because
         WebView2 reports load start and finish but no progress fraction - a bar
         claiming a percentage would be inventing it.

         Absolutely positioned, and that is a fix rather than a preference. It
         used to be `flex: 0 0 2px` in the column, which put it at the first
         pixel below the chrome viewport: the chrome is exactly tab strip plus
         toolbar tall, so `body { overflow: hidden }` clipped it and the
         indicator never rendered once. Measured 2026-08-04, top:76 in a 76px
         viewport.

         Pinned to the toolbar rather than to the bottom of the chrome, because
         the chrome's height moves - the find bar, the bookmarks bar and the
         address dropdown all change it, and the indicator should not wander. */
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--tab-strip-h) + var(--toolbar-h) - 2px);
        height: 2px;
        z-index: 30;
        overflow: hidden;
        pointer-events: none;
      }
      .progress[data-loading="true"]::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 32%;
        background: linear-gradient(90deg, transparent, var(--brume-haar-dark), transparent);
        animation: sweep 1.05s ease-in-out infinite;
      }
      @keyframes sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(420%); }
      }
    </style>
  </head>

  <body>
    <!--
      The new tab button lives outside the scrolling area on purpose, so it is
      reachable no matter how many tabs are open. See the .tabs comment.
    -->
    <div class="tabs" id="tabs">
      <div class="tab-scroll" id="tab-scroll"></div>
      <button class="new-tab" id="new-tab" title="New tab" aria-label="New tab">
        <span class="ico ico-plus"></span>
      </button>
    </div>

    <div class="toolbar">
      <button class="btn" id="back" title="Back" aria-label="Back" disabled>
        <span class="ico ico-back"></span>
      </button>
      <button class="btn" id="forward" title="Forward" aria-label="Forward" disabled>
        <span class="ico ico-forward"></span>
      </button>
      <button class="btn" id="reload" title="Reload" aria-label="Reload">
        <span class="ico ico-reload" id="reload-icon"></span>
      </button>
      <button class="btn" id="home" title="Home (Alt+Home)" aria-label="Home">
        <span class="ico ico-home"></span>
      </button>

      <div class="address">
        <span class="ico scheme ico-search" id="scheme-icon"></span>
        <input
          type="text"
          id="url"
          placeholder="Search, or enter an address"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
        />
      </div>

      <!--
        Hidden at 100%. A zoom readout that is always on screen is noise, and
        its presence is most of the signal: if you can see it, you are not at
        normal size. Clicking it goes back to 100%.
      -->
      <button class="btn zoom-btn" id="zoom" title="Reset zoom to 100%" aria-label="Reset zoom" hidden>
        <span id="zoom-level">100%</span>
      </button>
      <button class="btn" id="reader" title="Reader view" aria-label="Reader view">
        <span class="ico ico-reader"></span>
      </button>
      <button class="btn" id="bookmark" title="Bookmark this page" aria-label="Bookmark this page">
        <span class="ico ico-bookmark"></span>
      </button>
      <button class="btn" id="show-history" title="History" aria-label="History">
        <span class="ico ico-history"></span>
      </button>
      <button class="btn" id="show-settings" title="Settings" aria-label="Settings">
        <span class="ico ico-settings"></span>
      </button>
    </div>

    <!--
      Address bar suggestions. Positioned and sized in JS to line up with the
      address bar, and the Rust side is told how tall it ended up so it can grow
      the chrome by exactly that much. Filled from history and bookmarks.
    -->
    <div class="suggest" id="suggest" hidden></div>

    <!--
      Permission prompt. One at a time: a site that asks for the camera and the
      microphone at once gets two prompts in turn, which is easier to answer
      honestly than one combined question.
    -->
    <div class="permission" id="permission" hidden></div>

    <!--
      Site info, from clicking the padlock. Says whether the connection is
      encrypted and what this origin has been allowed, with a way to take it
      back. Read from the runtime, so it cannot claim something the engine is
      not actually enforcing.
    -->
    <div class="siteinfo" id="siteinfo" hidden></div>

    <!--
      Tab search, Ctrl+Shift+A. Worth having once the strip scrolls: a tab you
      cannot see is a tab you cannot click, and past about 26 on a 1200px window
      most of them are off screen.
    -->
    <div class="tabsearch" id="tabsearch" hidden>
      <input
        type="text"
        id="tabsearch-input"
        placeholder="Search tabs"
        spellcheck="false"
        autocomplete="off"
      />
      <div class="tabsearch-list" id="tabsearch-list"></div>
    </div>

    <!--
      The bookmarks bar. Off by default and toggled with Ctrl+Shift+B or the
      switch in Settings; the preference is stored, so it survives a restart.

      Above the find bar rather than below it: this one is part of the permanent
      chrome, while the find bar is transient and belongs against the page it is
      searching.

      Filled in by renderBookmarksBar - the items are not in the markup because
      the list comes from disk.
    -->
    <div class="bookmarks" id="bookmarks" hidden></div>

    <!--
      The find bar. Hidden by default; showing it grows the chrome webview by
      exactly its own height on the Rust side, so the page is pushed down rather
      than covered. A bar floating over the page could sit on top of the match
      it just scrolled to.
    -->
    <div class="findbar" id="findbar" hidden>
      <span class="ico ico-search"></span>
      <input
        type="text"
        id="find-input"
        placeholder="Find on page"
        spellcheck="false"
        autocomplete="off"
      />
      <span class="find-count" id="find-count"></span>
      <!--
        Two modifiers on the search, not two more actions. They read as text
        rather than icons because "Aa" and "ab" say what they do in less space
        than any glyph for them would.
      -->
      <button class="btn find-opt" id="find-case" data-on="false" title="Match case" aria-label="Match case">Aa</button>
      <button class="btn find-opt" id="find-word" data-on="false" title="Match whole word" aria-label="Match whole word">ab</button>
      <button class="btn" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">
        <span class="ico ico-back"></span>
      </button>
      <button class="btn" id="find-next" title="Next (Enter)" aria-label="Next match">
        <span class="ico ico-forward"></span>
      </button>
      <button class="btn" id="find-close" title="Close (Esc)" aria-label="Close find bar">
        <span class="ico ico-stop"></span>
      </button>
    </div>

    <!--
      Context menu, shared by the tab strip and the bookmarks bar. Positioned in
      JS at the pointer and populated per click, because the items depend on what
      was clicked: pin reads Pin or Unpin, and the close items are pointless on
      the only tab.
    -->
    <div class="ctxmenu" id="ctx-menu" hidden></div>

    <div class="progress" id="progress" data-loading="false"></div>

    <!--
      The panel occupies the space the page normally would. The Rust side grows
      this webview to the full window height while it is open, so everything
      privileged stays inside the one webview that holds capabilities.
    -->
    <section class="panel" id="panel" hidden>
      <header class="panel-head">
        <div class="seg" id="panel-views" role="tablist">
          <button class="seg-btn" data-view="history" role="tab">History</button>
          <button class="seg-btn" data-view="bookmarks" role="tab">Bookmarks</button>
          <button class="seg-btn" data-view="downloads" role="tab">Downloads</button>
          <button class="seg-btn" data-view="settings" role="tab">Settings</button>
        </div>
        <input
          type="text"
          id="panel-search"
          placeholder="Search"
          spellcheck="false"
          autocomplete="off"
        />
        <button class="btn" id="panel-newfolder" title="New folder" aria-label="New folder" hidden>
          <span class="ico ico-plus"></span>
        </button>
        <button class="btn" id="panel-export" title="Export bookmarks to a file" aria-label="Export bookmarks" hidden>
          <span class="ico ico-upload"></span>
        </button>
        <button class="btn" id="panel-clear" title="Clear history" aria-label="Clear history">
          <span class="ico ico-trash"></span>
        </button>
        <button class="btn" id="panel-close" title="Close" aria-label="Close">
          <span class="ico ico-stop"></span>
        </button>
      </header>
      <div class="panel-list" id="panel-list"></div>
    </section>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const { message } = window.__TAURI__.dialog;

      const el = (id) => document.getElementById(id);
      const urlInput = el("url");

      let loading = false;

      /**
       * True while the user is typing in the address bar.
       *
       * State events keep arriving during a page load, and overwriting the field
       * mid-keystroke is the single most infuriating thing an address bar can
       * do. Every real browser suppresses this; so does Brume.
       */
      let editing = false;

      /**
       * Invoke a command, surfacing any failure.
       *
       * A rejected promise with no handler is invisible - the button appears
       * dead, which is indistinguishable from a broken one and impossible to
       * report usefully.
       */
      function call(command, args) {
        return invoke(command, args).catch((err) => {
          console.error(`[brume] ${command} failed:`, err);
          message(String(err), { title: "Brume", kind: "error" });
        });
      }

      /* Origins already known to have no /favicon.ico.
       *
       * Without this the strip flickers. renderTabs rebuilds itself on every
       * state publish, and there are three or four of those per navigation, so
       * a site with no favicon went empty-box then fallback-mark each time. A
       * 404 is also frequently sent with no cache headers, so the request went
       * out again on every rebuild rather than being served from cache.
       *
       * Session-only and unbounded on purpose: it holds origins already visited
       * this session, which the history store knows anyway, and it disappears
       * on quit. */
      const faviconMisses = new Set();

      /** Favicon URL for a page, or null when there is nothing sensible to try. */
      function faviconFor(pageUrl) {
        try {
          const u = new URL(pageUrl);
          if (u.protocol !== "http:" && u.protocol !== "https:") return null;
          if (faviconMisses.has(u.origin)) return null;
          // Fetched straight from the site itself. Routing this through a
          // third-party favicon service would hand that service a log of every
          // domain visited, which is precisely what Brume is trying to avoid.
          return `${u.origin}/favicon.ico`;
        } catch {
          return null;
        }
      }

      /* Builds the favicon element for a tab or a list row.
       *
       * `lazy` matters more than it looks. The history panel renders up to 300
       * rows at once, and an eager <img> per row means a request to every domain
       * in your history the moment the panel opens: slow, and a burst of traffic
       * announcing to each site that you just opened it. Deferring to what is
       * actually on screen cuts that to the handful of visible rows.
       */
      function faviconNode(pageUrl, lazy) {
        const fallback = () => {
          const span = document.createElement("span");
          span.className = "tab-favicon-fallback";
          return span;
        };

        const src = faviconFor(pageUrl);
        if (!src) return fallback();

        const img = document.createElement("img");
        img.className = "tab-favicon";
        img.src = src;
        img.alt = "";
        if (lazy) img.loading = "lazy";
        img.addEventListener("error", () => {
          // Remembered, so neither this render nor the next one asks again.
          try {
            faviconMisses.add(new URL(pageUrl).origin);
          } catch {
            /* unparseable, nothing to remember */
          }
          img.replaceWith(fallback());
        });
        return img;
      }

      /* --- context menus ---------------------------------------------------
       *
       * One element, two callers: the tab strip and the bookmarks bar. Built
       * fresh on each open rather than kept in the DOM, because every item
       * depends on what was clicked - pin reads Pin or Unpin, and the close
       * items are meaningless when there is nothing else to close.
       */
      function closeMenu() {
        el("ctx-menu").hidden = true;
        // Lets the chrome shrink back, or it would keep covering the page.
        syncOverlay();
      }

      /* Builds a menu and places it at the pointer.
       *
       * `build` receives `add(label, enabled, run)`, `separator()` and
       * `submenu(label, build)`, so a caller writes only its own items. The
       * placement below is the part worth sharing: it is fiddly, and two copies
       * would drift.
       *
       * `at` only has to carry clientX and clientY, so a caller with no pointer
       * event - the overflow button, which opens under itself - can pass a plain
       * point instead.
       *
       * A submenu replaces the menu in place rather than flying out beside it.
       * That avoids hover timing entirely, works the same by keyboard, and can
       * be driven in a test; the cost is a Back item, which is cheap.
       */
      function openMenu(at, build) {
        const menu = el("ctx-menu");
        menu.textContent = "";

        const add = (label, enabled, run) => {
          const b = document.createElement("button");
          b.textContent = label;
          b.disabled = !enabled;
          if (enabled) {
            b.addEventListener("click", () => {
              closeMenu();
              run();
            });
          }
          menu.appendChild(b);
          return b;
        };
        const separator = () => menu.appendChild(document.createElement("hr"));
        const submenu = (label, buildChildren) => {
          const b = document.createElement("button");
          b.className = "has-sub";
          b.textContent = label;
          b.addEventListener("click", (event) => {
            // Or the document listener closes the menu we are replacing.
            event.stopPropagation();
            openMenu(at, buildChildren);
          });
          menu.appendChild(b);
        };

        build(add, separator, submenu);

        // Shown before measuring: a hidden element has no dimensions to clamp
        // against, so it would be positioned off the right edge every time.
        menu.hidden = false;
        const rect = menu.getBoundingClientRect();
        const x = Math.min(at.clientX, window.innerWidth - rect.width - 4);
        // Deliberately not clamped against innerHeight. The chrome webview is
        // only as tall as its own bars until syncOverlay grows it, so clamping
        // here pinned every menu to y=4 and clipped everything past 76px: a
        // menu of six items showed two. Measured on 2026-08-06, a tab menu ran
        // to 179px inside a 76px viewport. The ceiling is the same 720 the Rust
        // side clamps the overlay to, so a menu cannot ask for more than it gets.
        const y = Math.min(at.clientY, 720 - rect.height - 4);
        menu.style.left = `${Math.max(4, x)}px`;
        menu.style.top = `${Math.max(4, y)}px`;
        // Raises and grows the chrome to cover it. Without this the menu is
        // drawn into a webview that is not tall enough to show it.
        syncOverlay();
      }

      function openTabMenu(event, tab, allTabs) {
        const closable = allTabs.filter((t) => !t.pinned);
        const index = allTabs.findIndex((t) => t.id === tab.id);
        const toRight = allTabs.slice(index + 1).filter((t) => !t.pinned).length;

        openMenu(event, (add, separator) => {
          add("Duplicate", true, () => call("duplicate_tab", { id: tab.id }));
          add(tab.pinned ? "Unpin tab" : "Pin tab", true, () =>
            call("set_tab_pinned", { id: tab.id, pinned: !tab.pinned })
          );
          // The only reliable way in. The strip indicator would be the obvious
          // one, but it can only appear once a tab is already audible or muted,
          // and IsDocumentPlayingAudio has never been observed to report true
          // on this runtime - see audio.rs. Without this, muting is unreachable.
          add(tab.muted ? "Unmute tab" : "Mute tab", true, () =>
            call("set_tab_muted", { id: tab.id, muted: !tab.muted })
          );
          separator();
          // Splitting a tab with itself is one pane and a gap, so the active
          // tab is offered the way out instead of the way in.
          if (splitTabId === tab.id) {
            add("Close split view", true, () => call("set_split", { id: null }));
          } else {
            add(
              "Open in split view",
              !isActiveTab(tab.id) && allTabs.length > 1,
              () => call("set_split", { id: tab.id })
            );
          }
          // Disabled on the last tab: the window it would move to is the window
          // it is already in, and the source would close out from under it.
          // Offering it and then doing nothing is worse than saying no.
          add("Move to new window", allTabs.length > 1, () =>
            call("move_tab_to_new_window", { id: tab.id })
          );
          separator();
          // A pinned tab cannot be closed, so offer nothing that pretends it can.
          add("Close tab", !tab.pinned, () => call("close_tab", { id: tab.id }));
          add(
            "Close other tabs",
            closable.some((t) => t.id !== tab.id),
            () => call("close_other_tabs", { id: tab.id })
          );
          add("Close tabs to the right", toRight > 0, () =>
            call("close_tabs_to_right", { id: tab.id })
          );
        });
      }

      // Any click elsewhere dismisses it, and so does Escape. The chrome has
      // focus while the menu is open, so this keydown does fire, unlike one
      // aimed at the page.
      document.addEventListener("click", (event) => {
        if (!el("ctx-menu").contains(event.target)) closeMenu();
        // The padlock's own click stops propagating, so this only ever fires
        // for a click somewhere else.
        if (!el("siteinfo").hidden && !el("siteinfo").contains(event.target)) {
          closeSiteInfo();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeMenu();
        closeSiteInfo();
        // Dismissing a permission prompt is still an answer. The runtime is
        // holding the page open on a deferral, so walking away from it without
        // replying would leave the site waiting forever. Block, but do not
        // remember: not answering is not the same as saying no.
        if (!el("permission").hidden) answerPermission(false, false);
      });

      // --- tab strip ------------------------------------------------------
      function renderTabs(tabs) {
        const strip = el("tab-scroll");
        // Kept so the strip does not jump back to the left on every republish,
        // which happens on each load tick of every tab.
        const scrollLeft = strip.scrollLeft;
        strip.textContent = "";

        for (const tab of tabs) {
          const node = document.createElement("div");
          node.className = "tab";
          node.dataset.active = String(tab.active);
          // Marked, because a split tab occupies half the window while looking
          // like any other background tab. Without this the browser appears to
          // have lost track of what it is showing.
          node.dataset.split = String(tab.id === splitTabId);
          node.title = tab.title;
          node.addEventListener("click", () => call("activate_tab", { id: tab.id }));

          node.dataset.pinned = String(!!tab.pinned);

          // Audio indicator, and the control for it. Shown while a tab is making
          // noise and while it is muted, because a muted tab needs a way back.
          if (tab.audible || tab.muted) {
            const sound = document.createElement("button");
            sound.className = "tab-audio";
            sound.dataset.muted = String(!!tab.muted);
            sound.title = tab.muted ? "Unmute tab" : "Mute tab";
            sound.setAttribute("aria-label", sound.title);
            sound.addEventListener("click", (event) => {
              // Or muting a background tab would also switch to it.
              event.stopPropagation();
              call("set_tab_muted", { id: tab.id, muted: !tab.muted });
            });
            node.appendChild(sound);
          }
          node.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            openTabMenu(event, tab, tabs);
          });

          if (tab.private) {
            // The mask, not a favicon. Whose site it is matters less than the
            // fact that this tab is not being recorded, and fetching the icon
            // would mean a request to that site from a private tab.
            node.dataset.private = "true";
            const mark = document.createElement("span");
            mark.className = "ico tab-private";
            mark.title = "Private tab. Nothing here is saved.";
            node.appendChild(mark);
          } else {
            // Eager: the strip is always on screen and only ever holds a few.
            node.appendChild(faviconNode(tab.url, false));
          }

          const title = document.createElement("span");
          title.className = "tab-title";
          title.textContent = tab.title;
          node.appendChild(title);

          const close = document.createElement("button");
          close.className = "tab-close";
          close.title = "Close tab";
          close.setAttribute("aria-label", "Close tab");
          close.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg>';
          close.addEventListener("click", (event) => {
            // Without this the click also activates the tab being closed.
            event.stopPropagation();
            call("close_tab", { id: tab.id });
          });
          node.appendChild(close);

          strip.appendChild(node);
        }

        // Put the scroll back where it was, then make sure the active tab is
        // actually on screen. Switching with Ctrl+Tab past the visible run has
        // to bring the tab to you, or the strip silently disagrees with which
        // page is showing.
        strip.scrollLeft = scrollLeft;
        const active = strip.querySelector('.tab[data-active="true"]');
        if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      // --- toolbar --------------------------------------------------------
      function render(state) {
        // Set before renderTabs, which reads it to mark the split tab.
        splitTabId = state.split ?? null;
        // The layout switch. Driven from published state rather than read from
        // settings here, so the chrome relaying itself out and the page being
        // resized to match come off the same update.
        document.body.dataset.sidebar = String(!!state.sidebar);
        renderTabs(state.tabs);
        // Kept so tab search filters the same list the strip drew, rather than
        // asking the backend for a second copy that could disagree.
        lastTabs = state.tabs;
        if (!el("tabsearch").hidden) renderTabSearch();

        el("back").disabled = !state.canGoBack;
        el("forward").disabled = !state.canGoForward;

        loading = state.loading;
        el("progress").dataset.loading = String(state.loading);

        el("reader").dataset.on = String(!!state.reader);
        el("reader").title = state.reader
          ? "Show the original page"
          : "Reader view";
        el("bookmark").dataset.on = String(state.bookmarked);
        el("bookmark").title = state.bookmarked
          ? "Remove bookmark"
          : "Bookmark this page";

        // The bar's visibility rides the same update that resized the page for
        // it, so the row and the space for it can never be out of step. Rendered
        // only on the way in, not on every state event: those arrive dozens of
        // times per page load, and the list has not changed in any of them.
        const bar = el("bookmarks");
        const wasShowing = !bar.hidden;
        bar.hidden = !state.bookmarksBar;
        if (state.bookmarksBar && !wasShowing) renderBookmarksBar();

        // The panel can now be closed by the backend: opening a tab, navigating,
        // going back and reloading all dismiss it, because otherwise they happen
        // behind it and look like nothing happened. Following the published
        // state is what stops this document believing the panel is still up
        // after the Rust side has already laid the page back out.
        el("panel").hidden = !state.panelOpen;

        // Rounded, because WebView2 steps zoom in fractions that do not land on
        // whole percentages: 1.100000023841858 should read as 110%.
        const pct = Math.round((state.zoom ?? 1) * 100);
        el("zoom").hidden = pct === 100;
        el("zoom-level").textContent = `${pct}%`;

        el("reload-icon").className = state.loading ? "ico ico-stop" : "ico ico-reload";
        el("reload").title = state.loading ? "Stop" : "Reload";
        el("reload").setAttribute("aria-label", state.loading ? "Stop" : "Reload");

        if (!editing) {
          // Brume's new tab page shows nothing in the address bar. There is no
          // address worth reading there, and a chrome-internal URL would be
          // noise the moment anyone opened a tab.
          const isNewTab = /^https?:\/\/tauri\.localhost\/newtab\.html/.test(
            state.url || ""
          );
          urlInput.value = isNewTab ? "" : state.url || "";
          // A padlock only when the transport is actually encrypted. Showing one
          // for anything else would be a lie of exactly the kind padlocks exist
          // to prevent.
          const secure = (state.url || "").startsWith("https://");
          el("scheme-icon").className = secure
            ? "ico scheme ico-lock"
            : "ico scheme ico-search";
        }
      }

      /* --- bookmarks bar ---------------------------------------------------
       *
       * The row under the toolbar. Showing it grows the chrome webview by
       * exactly its own height on the Rust side, so the page moves down instead
       * of being covered.
       *
       * The list is fetched here rather than carried in brume://state. State is
       * published on every navigation, title change and load tick; the bookmarks
       * change when someone presses Ctrl+D. Putting the whole list in every one
       * of those would be a lot of copies of a thing that rarely moves, so
       * brume://bookmarks says when to re-read it instead.
       */
      let bookmarkItems = [];

      /** Just the root level, which is all the bar shows. Indexed by layout. */
      let barItems = [];

      /** The ones currently in the overflow menu, in bar order. */
      let bookmarkOverflow = [];

      /** Set by the bar's Rename, so the panel opens straight into editing. */
      let pendingRenameId = null;

      /** The tab currently shown beside the active one, or null. */
      let splitTabId = null;

      /** Whether a tab id is the active one, from the list the strip drew. */
      function isActiveTab(id) {
        return lastTabs.some((t) => t.id === id && t.active);
      }

      function openBookmark(bookmark, newTab) {
        if (newTab) {
          call("open_tab", { url: bookmark.url });
        } else {
          call("navigate", { input: bookmark.url });
        }
      }

      /** Direct children of a folder, or the root level for null. */
      function childrenOf(parentId) {
        return bookmarkItems.filter((b) => (b.parent ?? null) === parentId);
      }

      /** Menu contents for a folder: its links, and its folders as submenus. */
      function buildFolderMenu(folder) {
        return (add, separator, submenu) => {
          const kids = childrenOf(folder.id);
          if (!kids.length) {
            add("Empty", false, () => {});
            return;
          }
          for (const kid of kids) {
            if (kid.is_folder) {
              submenu(kid.title, buildFolderMenu(kid));
            } else {
              add(kid.title || kid.url, true, () => openBookmark(kid, false));
            }
          }
          separator();
          add(`Open all ${kids.filter((k) => !k.is_folder).length}`, true, () => {
            for (const kid of kids) if (!kid.is_folder) openBookmark(kid, true);
          });
        };
      }

      function openBookmarkMenu(at, bookmark) {
        openMenu(at, (add, separator) => {
          if (bookmark.is_folder) {
            add("Rename", true, () => renameBookmarkPrompt(bookmark));
            separator();
            // Says what it does. Deleting a folder keeps its contents, and
            // someone about to click this deserves to know that before they do.
            add("Delete folder, keep contents", true, () =>
              call("remove_bookmark", { id: bookmark.id })
            );
            return;
          }
          add("Open", true, () => openBookmark(bookmark, false));
          add("Open in new tab", true, () => openBookmark(bookmark, true));
          separator();
          add("Rename", true, () => renameBookmarkPrompt(bookmark));
          // No re-render here: remove_bookmark emits brume://bookmarks, so the
          // bar and the panel both refresh through the one path every change to
          // the list already takes.
          add("Remove", true, () => call("remove_bookmark", { id: bookmark.id }));
        });
      }

      /** Renames through the panel, which has a proper inline editor. */
      async function renameBookmarkPrompt(bookmark) {
        await openPanel("bookmarks");
        pendingRenameId = bookmark.id;
        renderPanel();
      }

      function bookmarkNode(bookmark, index) {
        const node = document.createElement("button");
        node.className = bookmark.is_folder ? "bm bm-folder" : "bm";
        // Where layout looks the bookmark back up after measuring.
        node.dataset.index = String(index);

        if (bookmark.is_folder) {
          const count = childrenOf(bookmark.id).length;
          node.title = `${bookmark.title}\n${count} item${count === 1 ? "" : "s"}`;
          const title = document.createElement("span");
          title.className = "bm-title";
          title.textContent = bookmark.title;
          node.appendChild(title);
          const chevron = document.createElement("span");
          chevron.className = "ico ico-chevron-down";
          node.appendChild(chevron);
          node.addEventListener("click", (event) => {
            // Or the document listener closes it in the tick it opened.
            event.stopPropagation();
            const rect = node.getBoundingClientRect();
